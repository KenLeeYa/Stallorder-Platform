name: Protected Primary read-only authentication diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify fixed read-only diagnostic and redaction boundaries
        run: node --test scripts/ci/delivery-auth-diagnostic.test.mjs
      - name: Record the native PostgreSQL diagnostic client
        run: psql --version
      - name: Diagnose direct and transaction connectivity without changing credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/ci/delivery-auth-diagnostic.mjs
