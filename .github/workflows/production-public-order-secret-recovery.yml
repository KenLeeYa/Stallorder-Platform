name: Production Public Order Secret Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or recover the existing public-order secrets to an encrypted local recipient
        type: choice
        options: [plan, apply]
        required: true
        default: plan
      plan_run_id:
        description: Successful immutable recovery Plan run ID
        type: string
        default: ""
      confirmation:
        description: Type RECOVER_PUBLIC_ORDER_ORIGINAL_SECRETS for Apply
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: production-public-order-secret-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RECOVERY_RECIPIENT_PUBLIC_KEY_BASE64: ${{ vars.RECOVERY_RECIPIENT_PUBLIC_KEY_BASE64 }}
      PRODUCTION_APPROVAL_OPERATION: production-public-order-secret-recovery
      PRODUCTION_APPROVAL_RECEIPT_PATH: artifacts/public-order-recovery-approval.json
      PRODUCTION_APPROVAL_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate owner and invocation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          if [ "$OPERATION" = plan ]; then
            test -z "$PRODUCTION_APPROVAL_PLAN_RUN_ID"
            test -z "$RECOVERY_CONFIRMATION"
          else
            [[ "$PRODUCTION_APPROVAL_PLAN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            test "$RECOVERY_CONFIRMATION" = RECOVER_PUBLIC_ORDER_ORIGINAL_SECRETS
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require verified Staging tree
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run production:check
      - run: npx vitest run scripts/lib/public-order-secret-recovery.test.mjs scripts/recover-public-order-runtime-secrets.test.mjs scripts/lib/production-approval.test.mjs
      - run: node scripts/run-npm-audit.mjs
      - name: Read canonical digests and recipient fingerprint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/recover-public-order-runtime-secrets.mjs prepare
      - name: Create immutable recovery Plan
        if: inputs.operation == 'plan'
        run: node scripts/production-approval.mjs create
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'plan'
        with:
          name: public-order-recovery-plan-${{ github.run_id }}
          path: artifacts/public-order-recovery-approval.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: inputs.operation == 'apply'
        with:
          name: public-order-recovery-plan-${{ inputs.plan_run_id }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify Plan, encrypt originals, and remove the temporary function
        if: inputs.operation == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/recover-public-order-runtime-secrets.mjs apply
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'apply' && success()
        with:
          name: encrypted-public-order-originals-${{ github.run_id }}
          path: artifacts/public-order-secret-envelope.json
          retention-days: 1
          if-no-files-found: error
