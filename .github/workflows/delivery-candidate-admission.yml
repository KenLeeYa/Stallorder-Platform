name: Exact delivery evidence admission

on:
  push:
    branches: [codex/primary-only-preparation]
    paths:
      - .github/workflows/delivery-candidate-admission.yml
      - scripts/ci/delivery-admission.mjs
      - scripts/ci/delivery-admission.test.mjs
      - scripts/ci/delivery-qualification.mjs
      - scripts/ci/delivery-qualification.test.mjs
      - scripts/ci/delivery-qualification-run17-source.json
      - scripts/ci/delivery-reviewed-run17-scan.json

permissions:
  contents: read
  actions: read
concurrency:
  group: exact-delivery-evidence-admission
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.repository.private == false && github.event.repository.fork == false && github.event.forced == false && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify bounded evidence controls
        working-directory: control
        run: node --test scripts/ci/delivery-admission.test.mjs scripts/ci/delivery-qualification.test.mjs scripts/ci/delivery-security-adjudication.test.mjs scripts/ci/delivery-security-capture.test.mjs scripts/ci/delivery-expiry-evidence.test.mjs
      - name: Reconstruct the exact candidate without installing or executing it
        run: node control/scripts/ci/delivery-candidate.mjs materialize
      - name: Authenticate full verification and reviewed source-security evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_QUALIFICATION_CONTRACT_SHA256: 2556f2cf9d780088b454da0aaa55056cd68d5a3bc2b33949e08afb2bd133aa84
          DELIVERY_SECURITY_REVIEW_SHA256: 5996e1c6aa0f87e016d4a0b4990aaf85c28b487b53a2294f3652e1e04e67f15a
        run: node control/scripts/ci/delivery-admission.mjs
