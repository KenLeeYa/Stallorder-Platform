name: Isolated old App credential rehearsal
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Local coordinator phase; database changes occur outside this workflow
        type: choice
        required: true
        options: [baseline, cutover, recovery, restore]
      fixture_baseline_sha256:
        description: SHA256 of exact hours and printers beforeimage durably held by the local coordinator
        type: string
        required: true
      fixture_identity:
        description: Exact phase profile IDs, QR ID and note durably held by the local coordinator
        type: string
        required: true
      baseline_deployment_id:
        description: Required only for restore; verified original baseline Preview deployment
        type: string
      baseline_url:
        description: Required only for restore; exact generated baseline Preview URL
        type: string
      baseline_run_id:
        description: Required only for restore; original baseline workflow run
        type: string
permissions:
  contents: read
concurrency:
  group: stallorder-preview-pr389-writer
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Preview
    defaults:
      run:
        working-directory: control
    env:
      DO_NOT_TRACK: '1'
      REHEARSAL_PHASE: ${{ inputs.phase }}
      FIXTURE_BASELINE_SHA256: ${{ inputs.fixture_baseline_sha256 }}
      FIXTURE_IDENTITY: ${{ inputs.fixture_identity }}
      VERCEL_ORG_ID: team_MMfsiG94K9Zy3e6w7Ccc9xY4
      VERCEL_PROJECT_ID: prj_uoG4FNJIgnF1LdKRiXnfRaieXnUP
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e95d2ea5d53ae78c5af9c3db044481237674c44
          path: old-app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Verify immutable old App and bounded producer
        run: |
          node scripts/ci/delivery-old-app-build.mjs source
          node --test scripts/ci/delivery-old-app-build.test.mjs scripts/ci/delivery-old-app-preview.test.mjs scripts/ci/delivery-old-app-cleanup.test.mjs
      - name: Install control QA dependencies
        run: npm ci
      - name: Install hosted browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify existing Preview and authenticate both endpoints with the synchronized GitHub secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          OLD_APP_PREVIEW_SEED: ${{ secrets.OLD_APP_PREVIEW_SEED }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/delivery-old-app-build.mjs configure
      - name: Build or verify the exact old App Preview
        id: old-app
        env:
          RESTORE_DEPLOYMENT_ID: ${{ inputs.baseline_deployment_id }}
          RESTORE_URL: ${{ inputs.baseline_url }}
          RESTORE_RUN_ID: ${{ inputs.baseline_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REHEARSAL_PHASE" = restore ]; then
            node scripts/ci/delivery-old-app-build.mjs restore
          else
            node scripts/ci/delivery-old-app-build.mjs deploy
          fi
      - name: Actual merchant and staff login, QR checkout, tracker and owned cleanup
        env:
          OLD_APP_PREVIEW_URL: ${{ steps.old-app.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node --import tsx scripts/qa-old-app-preview.mjs
      - name: Retain nonsecret acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old-app-${{ github.run_id }}-${{ inputs.phase }}
          path: control/artifacts/old-app-*
          if-no-files-found: ignore
          retention-days: 7
