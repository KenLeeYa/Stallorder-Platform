name: Independent Status Page

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status page operation
        required: true
        type: choice
        options:
          - plan
          - deploy
      confirmation:
        description: Type PLAN_STATUS_PAGE or DEPLOY_STATUS_PAGE
        required: true
        type: string
      plan_run_id:
        description: Successful plan run ID required for deploy
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: independent-status-page
  cancel-in-progress: false

jobs:
  plan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate protected invocation
        shell: bash
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Status page operations must run from main."
            exit 1
          }
          expected="PLAN_STATUS_PAGE"
          if [ "$INPUT_OPERATION" = "deploy" ]; then
            expected="DEPLOY_STATUS_PAGE"
          fi
          test "$INPUT_CONFIRMATION" = "$expected" || {
            echo "::error::Confirmation must be ${expected}."
            exit 1
          }
          if [ "$INPUT_OPERATION" = "deploy" ]; then
            [[ "$INPUT_PLAN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
              echo "::error::Deploy requires the successful Plan workflow run ID."
              exit 1
            }
            test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
              echo "::error::Only the repository owner may confirm Production apply."
              exit 1
            }
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID; do
            test -n "${!name:-}" || {
              echo "::error::Missing protected configuration: ${name}"
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify Worker bundle without publishing
        run: npm run status:check

      - name: Build Cloudflare dry-run plan
        run: npm run status:plan

      - name: Create immutable Production plan receipt
        if: inputs.operation == 'plan'
        env:
          PRODUCTION_APPROVAL_OPERATION: status-page-deploy
          PRODUCTION_APPROVAL_PARAMETERS_JSON: '{"hostname":"status.qidaigo.com","serviceName":"stallorder-status"}'
          PRODUCTION_APPROVAL_RECEIPT_PATH: artifacts/production-approval.json
        run: node scripts/production-approval.mjs create

      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'plan'
        with:
          name: status-page-deployment-plan-${{ github.run_id }}
          path: |
            artifacts/status-page-deployment-plan.json
            artifacts/production-approval.json
          if-no-files-found: error
          retention-days: 30

      - name: Download approved Status Page plan
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: status-page-deployment-plan-${{ inputs.plan_run_id }}
          path: approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify manual approval is bound to the immutable plan
        if: inputs.operation == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVAL_OPERATION: status-page-deploy
          PRODUCTION_APPROVAL_PARAMETERS_JSON: '{"hostname":"status.qidaigo.com","serviceName":"stallorder-status"}'
          PRODUCTION_APPROVAL_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PRODUCTION_APPROVAL_RECEIPT_PATH: approved-plan/production-approval.json
        run: node scripts/production-approval.mjs verify

      - name: Deploy Worker and custom domain
        if: inputs.operation == 'deploy'
        run: npm run status:deploy

      - name: Verify independent HTTPS status service
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          status_is_operational() {
            curl --fail --silent --show-error --max-time 10 \
              https://status.qidaigo.com/api/status \
              | node -e '
                  let data = "";
                  process.stdin.on("data", chunk => data += chunk);
                  process.stdin.on("end", () => {
                    const parsed = JSON.parse(data);
                    if (!Array.isArray(parsed.services)) process.exit(1);
                    const codes = new Set(parsed.services.map(service => service.code));
                    for (const code of ["QR_ORDERING", "STAFF_ORDERING", "PAYMENT_CHECKOUT"]) {
                      if (!codes.has(code)) process.exit(1);
                    }
                    if (parsed.status !== "OPERATIONAL") process.exit(1);
                    if (parsed.services.some(service => service.status !== "OPERATIONAL")) process.exit(1);
                  });
                '
          }
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              https://status.qidaigo.com/health | grep -qx 'ok' \
              && status_is_operational; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::status.qidaigo.com did not become fully operational in time."
              exit 1
            fi
            sleep 10
          done
          headers="$(curl --fail --silent --show-error --head --max-time 10 https://status.qidaigo.com/)"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^content-security-policy:' <<<"$headers"
