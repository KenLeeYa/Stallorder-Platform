name: Ephemeral Preview Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  workflow_dispatch:
    inputs:
      approve_external_preview:
        description: Approve isolated Preview resource mutations (also requires Preview environment approval)
        type: boolean
        default: false
      operation:
        description: Validate a manual Preview or clean exact historical PR-owned resources
        type: choice
        options: [validate, cleanup, cleanup-manual-run, resume-manual-run, regression-local]
        default: validate
      cleanup_pr_number:
        description: Exact closed PR number for manual cleanup only
        type: string
        default: ""

      cleanup_run_id:
        description: Exact completed manual validation run ID for recovery cleanup only
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'regression-local' && format('regression-local-{0}', github.ref) || contains(fromJSON('["cleanup-manual-run","resume-manual-run"]'), inputs.operation) && format('manual-preview-recovery-workflow-{0}', inputs.cleanup_run_id) || format('ephemeral-preview-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !contains(fromJSON('["cleanup-manual-run","resume-manual-run"]'), inputs.operation) }}

jobs:
  regression-local:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'regression-local' && inputs.approve_external_preview == false && github.ref_name == 'codex/integrated-production-20261002'
    uses: ./.github/workflows/ci.yml
    with:
      regression_only: true
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_external_preview == true &&
      inputs.operation == 'validate' &&
      (
        !(
          github.event.pull_request.number == 365 &&
          github.event.pull_request.head.ref == 'codex/line-platform-oa-v2-20260927' &&
          contains(github.event.pull_request.labels.*.name, 'line-preview-live')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: Preview
    env:
      DO_NOT_TRACK: "1"
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PARENT_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PREVIEW_BRANCH_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}-oauth-delivery', github.event.pull_request.number) || format('manual-{0}', github.run_id) }}
      PREVIEW_RESOURCE_KEY: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}', github.run_id) }}
      PREVIEW_GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PREVIEW_APPROVED_DEADLINE_UTC: "2026-10-04T15:30:00Z"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Verify actual Preview required-reviewers protection
        id: preview-approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/awesome-optimization/preview-approval.mjs

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 branch
        with:
          version: 2.109.1

      - name: Generate isolated Preview-only secrets
        shell: bash
        run: |
          for name in \
            AUDIT_IP_HASH_SECRET \
            ABUSE_HASH_SECRET \
            TOKEN_DERIVATION_SECRET \
            SESSION_FINGERPRINT_HASH_SECRET \
            OAUTH_STATE_SECRET \
            DELIVERY_MOCK_WEBHOOK_SECRET \
            OFFLINE_PERMIT_SIGNING_SECRET \
            CRON_SECRET \
            CRON_API_SECRET
          do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          {
            echo "OAUTH_PROVIDER_MODE=mock"
            echo "OAUTH_MOCK_GOOGLE_SUBJECT=preview-google-subject"
            echo "OAUTH_MOCK_LINE_SUBJECT=preview-line-subject"
            echo "OAUTH_MOCK_APPLE_SUBJECT=preview-apple-subject"
            echo "BACKEND_ACTIVE_TARGET=PRIMARY"
            echo "AUTH_PROJECT_CODE=PRIMARY"
            echo "PRODUCTION_ENVIRONMENT_APPROVED=false"
            echo "TRUSTED_CLIENT_IP_HEADER=x-real-ip"
            echo "REPORT_DELIVERY_MODE=simulate"
          } >> "$GITHUB_ENV"

      - name: Validate isolated environment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Preview environment is missing SUPABASE_ACCESS_TOKEN."
            exit 1
          }
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[0-9a-f]{40}$ ]] || {
            echo "::error::Preview SUPABASE_ACCESS_TOKEN must be the raw PAT without quotes or whitespace."
            exit 1
          }
          test -n "${SUPABASE_PARENT_PROJECT_REF:-}" || {
            echo "::error::Preview environment is missing SUPABASE_PARENT_PROJECT_REF."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate optional Vercel bypass header before paid resource creation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PREVIEW_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "$PREVIEW_GIT_BRANCH" = "codex/integrated-production-20261002" ]; then
            node scripts/preview-harness-preflight.mjs settings
          fi
          if [ -n "${VERCEL_TOKEN:-}" ] \
            && [ -n "${VERCEL_ORG_ID:-}" ] \
            && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            node --input-type=module -e '
              import { normalizePreviewBypassSecret } from "./scripts/qa-pr366-preview-ui.mjs";
              const secret = normalizePreviewBypassSecret(process.env.PREVIEW_BYPASS_SECRET);
              if (secret) console.log(`::add-mask::${secret}`);
              if (process.env.PREVIEW_GIT_BRANCH === "codex/integrated-production-20261002" && !secret) throw Error("PREVIEW_BYPASS_HEADER_REQUIRED");
            '
          fi

      - name: Prepare PR366 browser and verify unchanged Primary before paid resource creation
        if: github.event_name == 'workflow_dispatch' && env.PREVIEW_GIT_BRANCH == 'codex/integrated-production-20261002'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx playwright install --with-deps chromium
          mkdir -p .preview-receipt
          node -e 'require("node:fs").writeFileSync(".preview-receipt/expected-primary.json", JSON.stringify({deploymentId:"dpl_Cx8GfP12KuFHcCgtnZ7SXxzt4AYZ",sha:"5cc15c6a6189cfd56e127676bc5228e9ffd2ff56"}), {flag:"wx"})'
          node scripts/qa-pr366-preview-binding.mjs capture-baseline .preview-receipt/expected-primary.json .preview-receipt/primary-baseline.json
          for path in login staff/login; do
            test "$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "https://app.qidaigo.com/$path")" = "200"
          done

      - name: Record manual Preview owner and approved deadline before resource creation
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/manual-preview-cleanup.mjs capture

      - name: Upload initial manual Preview recovery receipt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-preview-initial-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: error

      - name: Create or reuse data-less Preview Branch
        id: preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          branches="$(supabase branches list \
            --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
            --output json \
            --log-level error)"
          branch_ref="$(
            jq -r --arg name "$PREVIEW_BRANCH_NAME" \
              '.[] | select(.name == $name) | .project_ref' <<<"$branches"
          )"

          if [ -z "$branch_ref" ]; then
            supabase branches create "$PREVIEW_BRANCH_NAME" \
              --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
              --region ap-southeast-1 \
              --size micro \
              --git-branch "$PREVIEW_GIT_BRANCH" \
              --log-level error >/dev/null
          fi

          branch_status=""
          preview_project_status=""
          for attempt in $(seq 1 60); do
            branches="$(supabase branches list \
              --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
              --output json \
              --log-level error)"
            branch_json="$(
              jq -c --arg name "$PREVIEW_BRANCH_NAME" \
                '.[] | select(.name == $name and .with_data == false)' <<<"$branches"
            )"
            branch_ref="$(
              jq -r '.project_ref // empty' <<<"$branch_json"
            )"
            branch_status="$(jq -r '.status // empty' <<<"$branch_json")"
            preview_project_status="$(
              jq -r '.preview_project_status // empty' <<<"$branch_json"
            )"
            case "$branch_status" in
              ACTIVE_HEALTHY|MIGRATIONS_FAILED) branch_action_terminal=true ;;
              *) branch_action_terminal=false ;;
            esac
            if [ -n "$branch_ref" ] \
              && [ "$branch_ref" != "$SUPABASE_PARENT_PROJECT_REF" ] \
              && [ "$preview_project_status" = "ACTIVE_HEALTHY" ] \
              && [ "$branch_action_terminal" = "true" ]; then
              break
            fi
            sleep 5
          done

          test -n "$branch_ref" && test "$branch_ref" != "$SUPABASE_PARENT_PROJECT_REF" || {
            echo "::error::Data-less Preview Branch did not become available."
            exit 1
          }
          [ "$preview_project_status" = "ACTIVE_HEALTHY" ] || {
            echo "::error::Preview Branch database did not become healthy."
            exit 1
          }
          case "$branch_status" in
            ACTIVE_HEALTHY) ;;
            MIGRATIONS_FAILED)
              echo "::warning::Hosted Branching migrations ended before the isolated reviewed migration gate."
              ;;
            *)
              echo "::error::Hosted Preview Branch action did not reach a terminal state."
              exit 1
              ;;
          esac
          echo "branch_ref=$branch_ref" >> "$GITHUB_OUTPUT"

      - name: Capture exact manual Preview Branch for recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/manual-preview-cleanup.mjs capture

      - name: Upload manual Preview Branch identity receipt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-preview-branch-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: error

      - name: Load and mask Preview Branch configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          config="$(
            supabase branches get "$PREVIEW_BRANCH_NAME" \
              --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
              --output json \
              --log-level error
          )"
          raw_transaction_url="$(jq -r '.POSTGRES_URL' <<<"$config")"
          supabase_url="$(jq -r '.SUPABASE_URL' <<<"$config")"
          anon_key="$(jq -r '.SUPABASE_ANON_KEY' <<<"$config")"
          service_role_key="$(jq -r '.SUPABASE_SERVICE_ROLE_KEY // empty' <<<"$config")"
          session_url="${raw_transaction_url/:6543\//:5432\/}"
          case "$raw_transaction_url" in
            *\?*) transaction_url="${raw_transaction_url}&pgbouncer=true" ;;
            *) transaction_url="${raw_transaction_url}?pgbouncer=true" ;;
          esac

          for value in "$raw_transaction_url" "$transaction_url" "$session_url" "$supabase_url" "$anon_key" "$service_role_key"; do
            test -n "$value" && test "$value" != "null" || {
              echo "::error::Preview Branch configuration is incomplete."
              exit 1
            }
            echo "::add-mask::$value"
          done

          {
            echo "DATABASE_URL=$transaction_url"
            echo "DIRECT_URL=$session_url"
            echo "EPHEMERAL_DATABASE_URL=$session_url"
            echo "NEXT_PUBLIC_SUPABASE_URL=$supabase_url"
            echo "PRIMARY_SUPABASE_URL=$supabase_url"
            echo "SUPABASE_SECRET_KEY=$service_role_key"
            echo "PRIMARY_SUPABASE_SECRET_KEY=$service_role_key"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$anon_key"
            echo "NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=$supabase_url/functions/v1"
          } >> "$GITHUB_ENV"

      - name: Wait for Preview Branch database stability
        shell: bash
        run: |
          set -euo pipefail
          stable_connections=0
          for attempt in $(seq 1 60); do
            if supabase migration list --db-url "$EPHEMERAL_DATABASE_URL" >/dev/null 2>&1; then
              stable_connections="$((stable_connections + 1))"
              if [ "$stable_connections" -ge 2 ]; then
                break
              fi
            else
              stable_connections=0
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 5
            fi
          done
          [ "$stable_connections" -ge 2 ] || {
            echo "::error::Preview Branch database did not remain reachable for two consecutive probes."
            exit 1
          }

      - name: Apply reviewed migrations and synthetic fixtures
        run: |
          set -o pipefail
          test "${{ steps.preview.outputs.branch_ref }}" != "$SUPABASE_PARENT_PROJECT_REF" || {
            echo "::error::Refusing to seed the parent Supabase project."
            exit 1
          }

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            migration_log="$(mktemp)"
            if supabase db push \
              --db-url "$EPHEMERAL_DATABASE_URL" \
              --include-all \
              --include-seed \
              --yes 2>&1 | tee "$migration_log"; then
              rm -f "$migration_log"
              break
            fi

            if ! grep -Eq \
              'terminating connection due to administrator command|Connection timed out|failed to connect to postgres' \
              "$migration_log"; then
              rm -f "$migration_log"
              echo "::error::Preview migration push failed with a non-transient error."
              exit 1
            fi

            rm -f "$migration_log"
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Preview database did not stabilize after $max_attempts migration attempts."
              exit 1
            fi

            echo "::warning::Preview database restarted during migration attempt $attempt; retrying after provisioning settles."
            sleep $((attempt * 15))
          done

      - name: Verify isolated migration history
        run: supabase migration list --db-url "$EPHEMERAL_DATABASE_URL"

      - name: Reset reusable Preview-only fixture state
        run: |
          supabase db query \
            --db-url "$EPHEMERAL_DATABASE_URL" \
            --file supabase/fixtures/delivery_mock_preview_cleanup.sql \
            --log-level error

      - name: Run isolated database tests
        run: supabase test db supabase/tests/database --db-url "$EPHEMERAL_DATABASE_URL"

      - name: Lint isolated database
        run: supabase db lint --db-url "$EPHEMERAL_DATABASE_URL" --schema public,app_private,internal --level warning --fail-on warning

      - name: Apply Preview-only OAuth and delivery fixture
        run: |
          test "${{ steps.preview.outputs.branch_ref }}" != "$SUPABASE_PARENT_PROJECT_REF" || {
            echo "::error::Refusing to apply synthetic fixtures to the parent Supabase project."
            exit 1
          }
          supabase db query \
            --db-url "$EPHEMERAL_DATABASE_URL" \
            --file supabase/fixtures/delivery_mock_preview.sql \
            --log-level error

      - name: Configure PR366 synthetic public ordering in the owned child only
        if: github.ref_name == 'codex/integrated-production-20261002'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${{ steps.preview.outputs.branch_ref }}"
          test -n "$project_ref" && test "$project_ref" != "$SUPABASE_PARENT_PROJECT_REF"
          test "$project_ref" != "daeqwtpaxcebmtwxqdkj"
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module - "$secret_file" <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.argv[2], [
            `ABUSE_HASH_SECRET=${process.env.ABUSE_HASH_SECRET}`,
            `TOKEN_DERIVATION_SECRET=${process.env.TOKEN_DERIVATION_SECRET}`,
            'APP_ENV=test',
            'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA',
            'TURNSTILE_ALLOW_TEST_KEYS=true',
          ].join('\n') + '\n', { mode: 0o600 });
          NODE
          supabase secrets set --project-ref "$project_ref" --env-file "$secret_file" > /dev/null

      - name: Deploy Edge Functions to isolated branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${{ steps.preview.outputs.branch_ref }}"
          for function_directory in supabase/functions/*; do
            test -f "$function_directory/index.ts" || continue
            function_name="$(basename "$function_directory")"
            deployed=false
            for attempt in 1 2 3; do
              deploy_log="$(mktemp)"
              if supabase functions deploy "$function_name" \
                --project-ref "$project_ref" \
                --use-api \
                --import-map supabase/functions/deno.json \
                >"$deploy_log" 2>&1; then
                deployed=true
                rm -f "$deploy_log"
                break
              fi
              if grep -Eqi \
                'unexpected deploy status (429|500|502|503|504)|"retryable"[[:space:]]*:[[:space:]]*true' \
                "$deploy_log" \
                && [ "$attempt" -lt 3 ]; then
                delay_seconds="$((attempt * 60))"
                echo "::warning::Transient Supabase deployment failure for ${function_name}; retrying in ${delay_seconds}s."
                rm -f "$deploy_log"
                sleep "$delay_seconds"
                continue
              fi
              status_code="$(grep -Eio 'unexpected deploy status [0-9]{3}' "$deploy_log" | tail -n 1 || true)"
              rm -f "$deploy_log"
              echo "::error::Edge Function deployment failed for ${function_name}${status_code:+ (${status_code})}."
              exit 1
            done
            test "$deployed" = "true" || {
              echo "::error::Edge Function deployment retry limit reached for ${function_name}."
              exit 1
            }
          done

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build against isolated configuration
        run: npm run build

      - name: Check optional Vercel Preview authorization
        id: vercel-auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] \
            && [ -n "${VERCEL_ORG_ID:-}" ] \
            && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel Preview cloud validation skipped. Configure Preview VERCEL_TOKEN plus VERCEL_ORG_ID and VERCEL_PROJECT_ID."
          fi

      - name: Resolve optional isolated live LINE Preview
        id: line-preview
        if: github.event_name == 'pull_request'
        env:
          LINE_LIVE_PREVIEW_BRANCH: ${{ vars.LINE_LIVE_PREVIEW_BRANCH }}
          LINE_PREVIEW_CHANNEL_ID: ${{ vars.LINE_PREVIEW_CHANNEL_ID }}
          LINE_PREVIEW_CHANNEL_SECRET: ${{ secrets.LINE_PREVIEW_CHANNEL_SECRET }}
        run: |
          if [ -n "${LINE_LIVE_PREVIEW_BRANCH:-}" ] \
            && [ "$PREVIEW_GIT_BRANCH" = "$LINE_LIVE_PREVIEW_BRANCH" ]; then
            test -n "${LINE_PREVIEW_CHANNEL_ID:-}" \
              && test -n "${LINE_PREVIEW_CHANNEL_SECRET:-}" || {
                echo "::error::Selected LINE live Preview branch has incomplete credentials."
                exit 1
              }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy matching Vercel Preview
        id: vercel-preview
        if: steps.vercel-auth.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          LINE_PREVIEW_CHANNEL_ID: ${{ vars.LINE_PREVIEW_CHANNEL_ID }}
          LINE_PREVIEW_CHANNEL_SECRET: ${{ secrets.LINE_PREVIEW_CHANNEL_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' > .vercel/project.json

          preview_head="$(git rev-parse HEAD)"
          git switch -C "$PREVIEW_GIT_BRANCH" "$preview_head"
          [ "$(git branch --show-current)" = "$PREVIEW_GIT_BRANCH" ] || {
            echo "::error::Matching Preview is not attached to the requested Git branch."
            exit 1
          }

          line_env_args=()
          if [ "$PREVIEW_GIT_BRANCH" = "codex/integrated-production-20261002" ]; then
            for entry in "APP_ENV=test" "COMPLIANCE_ENABLED=false" "COMPLIANCE_DELETION_DRY_RUN=true" "LINE_PLATFORM_ENABLED=false" "LINE_PAY_OPERATIONAL_STATUS=MAINTENANCE" "PAYMENT_LINE_PAY_MERCHANT_ID=" "PAYMENT_LINE_PAY_CHANNEL_SECRET=" "ABUSE_HASH_SECRET=$ABUSE_HASH_SECRET" "TOKEN_DERIVATION_SECRET=$TOKEN_DERIVATION_SECRET" "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" "TURNSTILE_ALLOW_TEST_KEYS=true"; do
              line_env_args+=(--build-env "$entry" --env "$entry")
            done
          fi
          if [ "$PREVIEW_GIT_BRANCH" = "codex/line-platform-oa-v2-20260927" ]; then
            for entry in "OPENAI_API_KEY=" "AZURE_TRANSLATOR_KEY=" "OPENAI_TRANSLATION_ENABLED=false" "CATALOG_TRANSLATION_ENABLED=false" "LINE_PLATFORM_ENABLED=false"; do
              line_env_args+=(--build-env "$entry" --env "$entry")
            done
          fi
          if [ "${{ steps.line-preview.outputs.enabled }}" = "true" ]; then
            line_env_args+=(
              --build-env "OAUTH_LINE_PREVIEW_LIVE=true"
              --build-env "LINE_CHANNEL_ID=$LINE_PREVIEW_CHANNEL_ID"
              --build-env "LINE_CHANNEL_SECRET=$LINE_PREVIEW_CHANNEL_SECRET"
              --env "OAUTH_LINE_PREVIEW_LIVE=true"
              --env "LINE_CHANNEL_ID=$LINE_PREVIEW_CHANNEL_ID"
              --env "LINE_CHANNEL_SECRET=$LINE_PREVIEW_CHANNEL_SECRET"
            )
          fi

          deployment="$(
            npx --yes vercel@58.3.0 deploy . \
              --yes \
              --target preview \
              --json \
              --token "$VERCEL_TOKEN" \
              --project "$VERCEL_PROJECT_ID" \
              --meta "stallorderPreviewRun=$GITHUB_RUN_ID" \
              --meta "stallorderPreviewResource=$PREVIEW_RESOURCE_KEY" \
              --meta "stallorderPreviewGitBranch=$PREVIEW_GIT_BRANCH" \
              --meta "githubDeployment=1" \
              --meta "githubCommitRef=$PREVIEW_GIT_BRANCH" \
              --build-env "DATABASE_URL=$DATABASE_URL" \
              --build-env "DIRECT_URL=$DIRECT_URL" \
              --build-env "PRIMARY_SUPABASE_URL=$PRIMARY_SUPABASE_URL" \
              --build-env "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" \
              --build-env "PRIMARY_SUPABASE_SECRET_KEY=$PRIMARY_SUPABASE_SECRET_KEY" \
              --build-env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
              --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              --build-env "NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=$NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL" \
              --build-env "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" \
              --build-env "OAUTH_PROVIDER_MODE=$OAUTH_PROVIDER_MODE" \
              --build-env "OAUTH_STATE_SECRET=$OAUTH_STATE_SECRET" \
              --build-env "DELIVERY_MOCK_WEBHOOK_SECRET=$DELIVERY_MOCK_WEBHOOK_SECRET" \
              --build-env "AUDIT_IP_HASH_SECRET=$AUDIT_IP_HASH_SECRET" \
              --build-env "SESSION_FINGERPRINT_HASH_SECRET=$SESSION_FINGERPRINT_HASH_SECRET" \
              --build-env "OFFLINE_PERMIT_SIGNING_SECRET=$OFFLINE_PERMIT_SIGNING_SECRET" \
              --build-env "CRON_SECRET=$CRON_SECRET" \
              --build-env "CRON_API_SECRET=$CRON_API_SECRET" \
              --build-env "TRUSTED_CLIENT_IP_HEADER=$TRUSTED_CLIENT_IP_HEADER" \
              --build-env "ALLOW_DEMO_SEED=true" \
              --build-env "BACKEND_ACTIVE_TARGET=$BACKEND_ACTIVE_TARGET" \
              --build-env "AUTH_PROJECT_CODE=$AUTH_PROJECT_CODE" \
              --build-env "PRODUCTION_ENVIRONMENT_APPROVED=false" \
              --env "DATABASE_URL=$DATABASE_URL" \
              --env "DIRECT_URL=$DIRECT_URL" \
              --env "PRIMARY_SUPABASE_URL=$PRIMARY_SUPABASE_URL" \
              --env "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" \
              --env "PRIMARY_SUPABASE_SECRET_KEY=$PRIMARY_SUPABASE_SECRET_KEY" \
              --env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
              --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              --env "NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=$NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL" \
              --env "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" \
              --env "OAUTH_PROVIDER_MODE=$OAUTH_PROVIDER_MODE" \
              --env "OAUTH_STATE_SECRET=$OAUTH_STATE_SECRET" \
              --env "OAUTH_MOCK_GOOGLE_SUBJECT=$OAUTH_MOCK_GOOGLE_SUBJECT" \
              --env "OAUTH_MOCK_LINE_SUBJECT=$OAUTH_MOCK_LINE_SUBJECT" \
              --env "OAUTH_MOCK_APPLE_SUBJECT=$OAUTH_MOCK_APPLE_SUBJECT" \
              --env "DELIVERY_MOCK_WEBHOOK_SECRET=$DELIVERY_MOCK_WEBHOOK_SECRET" \
              --env "AUDIT_IP_HASH_SECRET=$AUDIT_IP_HASH_SECRET" \
              --env "SESSION_FINGERPRINT_HASH_SECRET=$SESSION_FINGERPRINT_HASH_SECRET" \
              --env "OFFLINE_PERMIT_SIGNING_SECRET=$OFFLINE_PERMIT_SIGNING_SECRET" \
              --env "CRON_SECRET=$CRON_SECRET" \
              --env "CRON_API_SECRET=$CRON_API_SECRET" \
              --env "TRUSTED_CLIENT_IP_HEADER=$TRUSTED_CLIENT_IP_HEADER" \
              --env "ALLOW_DEMO_SEED=true" \
              --env "BACKEND_ACTIVE_TARGET=$BACKEND_ACTIVE_TARGET" \
              --env "AUTH_PROJECT_CODE=$AUTH_PROJECT_CODE" \
              --env "PRODUCTION_ENVIRONMENT_APPROVED=false" \
              --env "REPORT_DELIVERY_MODE=simulate" \
              "${line_env_args[@]}"
          )"
          deployment_id="$(jq -r '.deployment.id // .id // empty' <<<"$deployment")"
          deployment_url="$(jq -r '.deployment.url // .url // empty' <<<"$deployment")"
          test -n "$deployment_id" && test -n "$deployment_url" || {
            echo "::error::Vercel CLI did not return a deployment ID and URL."
            exit 1
          }
          [[ "$deployment_url" == http* ]] || deployment_url="https://$deployment_url"

          deployment_details="$(
            npx --yes vercel@58.3.0 api "/v13/deployments/$deployment_id" \
              --raw \
              --token "$VERCEL_TOKEN"
          )"
          actual_git_branch="$(
            jq -r '.meta.githubCommitRef // empty' <<<"$deployment_details"
          )"
          [ "$actual_git_branch" = "$PREVIEW_GIT_BRANCH" ] || {
            echo "::error::Vercel did not attach the matching Preview to the requested Git branch."
            exit 1
          }
          actual_git_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$deployment_details")"
          [ "$actual_git_sha" = "$preview_head" ] || {
            echo "::error::Vercel Preview deployment commit differs from the reviewed Pull Request merge tree."
            exit 1
          }
          actual_project_id="$(jq -r '.projectId // empty' <<<"$deployment_details")"
          preview_target="$(jq -r 'if .target == null or .target == "preview" then "true" else "false" end' <<<"$deployment_details")"
          [ "$actual_project_id" = "$VERCEL_PROJECT_ID" ] && [ "$preview_target" = "true" ] || {
            echo "::error::Vercel deployment project or target does not match the isolated Preview."
            exit 1
          }

          runtime_env_names="$(
            jq -r '.env[] | split("=")[0]' <<<"$deployment_details"
          )"
          build_env_names="$(
            jq -r '.build.env[] | split("=")[0]' <<<"$deployment_details"
          )"
          configured_translation_envs=0
          for name in \
            AI_TRANSLATION_PROVIDER \
            AZURE_TRANSLATOR_KEY \
            AZURE_TRANSLATOR_REGION \
            CATALOG_TRANSLATION_ENABLED
          do
            runtime_configured=false
            build_configured=false
            grep -Fxq "$name" <<<"$runtime_env_names" && runtime_configured=true
            grep -Fxq "$name" <<<"$build_env_names" && build_configured=true
            [ "$runtime_configured" = "$build_configured" ] || {
              echo "::error::Matching Preview has inconsistent runtime and build configuration for $name."
              exit 1
            }
            if [ "$runtime_configured" = "true" ]; then
              configured_translation_envs="$((configured_translation_envs + 1))"
            fi
          done

          case "$configured_translation_envs" in
            0)
              echo "translation_enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Catalog translation smoke skipped because this branch has no Azure Preview configuration."
              ;;
            4)
              echo "translation_enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Matching Preview has incomplete catalog translation configuration ($configured_translation_envs/4)."
              exit 1
              ;;
          esac

          if [ "${{ steps.line-preview.outputs.enabled }}" = "true" ]; then
            for name in OAUTH_LINE_PREVIEW_LIVE LINE_CHANNEL_ID LINE_CHANNEL_SECRET; do
              grep -Fxq "$name" <<<"$runtime_env_names" \
                && grep -Fxq "$name" <<<"$build_env_names" || {
                  echo "::error::Matching LINE live Preview is missing $name in runtime or build."
                  exit 1
                }
            done
            if grep -Fxq LINE_REDIRECT_URI <<<"$runtime_env_names" \
              || grep -Fxq LINE_REDIRECT_URI <<<"$build_env_names"; then
              echo "::error::LINE live Preview must use its unique deployment callback, not a static redirect."
              exit 1
            fi
            echo "line_live_enabled=true" >> "$GITHUB_OUTPUT"
          else
            for name in OAUTH_LINE_PREVIEW_LIVE LINE_CHANNEL_ID LINE_CHANNEL_SECRET; do
              if grep -Fxq "$name" <<<"$runtime_env_names" \
                || grep -Fxq "$name" <<<"$build_env_names"; then
                echo "::error::Unpaired LINE credentials appeared in an ordinary Preview."
                exit 1
              fi
            done
            echo "line_live_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify captured Preview deployment coordinates
        if: steps.vercel-preview.outputs.deployment_id != ''
        env:
          CAPTURED_DEPLOYMENT_ID: ${{ steps.vercel-preview.outputs.deployment_id }}
          CAPTURED_DEPLOYMENT_URL: ${{ steps.vercel-preview.outputs.url }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({id:process.env.CAPTURED_DEPLOYMENT_ID,url:process.env.CAPTURED_DEPLOYMENT_URL}))' | node scripts/preview-harness-preflight.mjs deployment

      - name: Capture exact manual Vercel deployment for recovery
        if: github.event_name == 'workflow_dispatch' && steps.vercel-auth.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/manual-preview-cleanup.mjs capture

      - name: Upload paired manual Preview deployment receipt
        if: github.event_name == 'workflow_dispatch' && steps.vercel-auth.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-preview-paired-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: error

      - name: Capture fresh PR366 paired target and run browser QA before cleanup
        if: github.event_name == 'workflow_dispatch' && env.PREVIEW_GIT_BRANCH == 'codex/integrated-production-20261002' && steps.vercel-auth.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR366_CHILD_REF: ${{ steps.preview.outputs.branch_ref }}
          PR366_DEPLOYMENT_ID: ${{ steps.vercel-preview.outputs.deployment_id }}
          PR366_CHILD_DATABASE_URL: ${{ env.DATABASE_URL }}
          PREVIEW_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          PR366_CHILD_DATABASE_URL="$(node -e 'try { const u = new URL(process.env.PR366_CHILD_DATABASE_URL); u.searchParams.set("sslmode", "require"); process.stdout.write(u.href); } catch { process.stderr.write("PR366_DATABASE_URL_INVALID"); process.exit(1); }')"
          export PR366_CHILD_DATABASE_URL
          PR366_PRIVATE_FIXTURE_DIR="$(mktemp -d)"
          chmod 700 "$PR366_PRIVATE_FIXTURE_DIR"
          export PR366_PRIVATE_FIXTURE_DIR
          trap 'rm -rf "$PR366_PRIVATE_FIXTURE_DIR"' EXIT
          node -e 'require("node:fs").writeFileSync(".preview-receipt/ui-selection.json", JSON.stringify({childRef:process.env.PR366_CHILD_REF,deploymentId:process.env.PR366_DEPLOYMENT_ID}), {flag:"wx"})'
          node scripts/qa-pr366-preview-binding.mjs capture-binding .preview-receipt/manual-resources.json .preview-receipt/ui-selection.json .preview-receipt/primary-baseline.json .preview-receipt/ui-binding.json
          preview_origin="$(node -e 'const b=JSON.parse(require("node:fs").readFileSync(".preview-receipt/ui-binding.json","utf8")); process.stdout.write(new URL(b.origin).origin);')"
          supabase secrets set --project-ref "$PR366_CHILD_REF" "PUBLIC_APP_ORIGINS=$preview_origin" "TRUSTED_CLIENT_IP_HEADER=x-real-ip" > /dev/null
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui catalog-descriptor
          for operation in enable-supply dense-schedule dense-workforce dense-supply synthetic-invoices inbox inbox-membership; do
            node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui "$operation"
          done
          node -e 'const fs = require("node:fs"); const p = ".preview-receipt/ui-binding.json"; const b = JSON.parse(fs.readFileSync(p,"utf8")); const load = name => JSON.parse(fs.readFileSync(`.preview-receipt/pr366-ui/fixture-${name}.json`,"utf8")); b.fixtures = {catalogProduct:load("catalog-descriptor"),schedule:load("dense-schedule"),workforce:load("dense-workforce"),supply:load("dense-supply"),invoices:load("synthetic-invoices"),inbox:load("inbox"),membership:load("inbox-membership")}; b.fixtureActions = {prepareDenseExpenses:true}; fs.writeFileSync(p,JSON.stringify(b,null,2));'
          for operation in prepare-ordering prepare-pos-product; do
            node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui "$operation"
          done
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui prepare-cash-shift
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui pos-descriptor
          node -e 'const fs=require("node:fs"); const p=".preview-receipt/ui-binding.json"; const b=JSON.parse(fs.readFileSync(p,"utf8")); b.fixtures.pos=JSON.parse(fs.readFileSync(".preview-receipt/pr366-ui/fixture-pos-descriptor.json","utf8")); fs.writeFileSync(p,JSON.stringify(b,null,2));'
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui inbox-readback .preview-receipt/pr366-ui/fixture-inbox.json
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui inbox-membership-readback .preview-receipt/pr366-ui/inbox-membership-revoked.json
          for operation in enable-circuit-b public-qr open-hours; do
            node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui "$operation"
          done
          refresh_binding() {
            node scripts/qa-pr366-preview-binding.mjs capture-binding .preview-receipt/manual-resources.json .preview-receipt/ui-selection.json .preview-receipt/primary-baseline.json ".preview-receipt/ui-binding-$1.json"
            node -e 'const fs=require("node:fs"); const p=".preview-receipt/ui-binding.json"; const old=JSON.parse(fs.readFileSync(p,"utf8")); const fresh=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fresh.fixtures=old.fixtures; fresh.fixtureActions=old.fixtureActions; fresh.fixtures.hours=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); fs.writeFileSync(p,JSON.stringify(fresh,null,2));' ".preview-receipt/ui-binding-$1.json" ".preview-receipt/pr366-ui/fixture-$1-hours.json"
          }
          refresh_binding open
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui midnight-rollback
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui hours-open
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui closed-hours
          refresh_binding closed
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui hours-closed
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui verify-rejected-orders .preview-receipt/pr366-ui/ui-hours-closed.json
          node -e 'const fs=require("node:fs"); const load=phase=>JSON.parse(fs.readFileSync(`.preview-receipt/pr366-ui/fixture-${phase}-hours.json`,"utf8")); const open=load("open"),closed=load("closed"); if(JSON.stringify(open.after)!==JSON.stringify(closed.before)) throw Error("HOURS_PHASE_CHAIN_CHANGED"); fs.writeFileSync(".preview-receipt/pr366-ui/fixture-original-hours.json",JSON.stringify({...closed,before:open.before}),{flag:"wx"});'
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui restore-hours .preview-receipt/pr366-ui/fixture-original-hours.json
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui overnight-hours
          refresh_binding overnight
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui hours-overnight
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui cutoff-hours
          refresh_binding cutoff
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui hours-cutoff
          node -e 'const fs=require("node:fs"); const load=phase=>JSON.parse(fs.readFileSync(`.preview-receipt/pr366-ui/fixture-${phase}-hours.json`,"utf8")); const overnight=load("overnight"),cutoff=load("cutoff"); if(JSON.stringify(overnight.after)!==JSON.stringify(cutoff.before)) throw Error("HOURS_PHASE_CHAIN_CHANGED"); fs.writeFileSync(".preview-receipt/pr366-ui/fixture-calendar-original-hours.json",JSON.stringify({...cutoff,before:overnight.before}),{flag:"wx"});'
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui restore-hours .preview-receipt/pr366-ui/fixture-calendar-original-hours.json
          for operation in ordering supply; do
            fixture_operation="enable-$operation"
            if [ "$operation" = ordering ]; then fixture_operation=prepare-ordering; fi
            node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui "restore-$operation" ".preview-receipt/pr366-ui/fixture-$fixture_operation.json"
          done
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui prepare-preorder
          node scripts/qa-pr366-preview-binding.mjs capture-binding .preview-receipt/manual-resources.json .preview-receipt/ui-selection.json .preview-receipt/primary-baseline.json .preview-receipt/ui-binding-preorder.json
          node -e 'const fs=require("node:fs"); const p=".preview-receipt/ui-binding.json"; const old=JSON.parse(fs.readFileSync(p,"utf8")); const fresh=JSON.parse(fs.readFileSync(".preview-receipt/ui-binding-preorder.json","utf8")); fresh.fixtures={...old.fixtures,preorder:JSON.parse(fs.readFileSync(".preview-receipt/pr366-ui/fixture-prepare-preorder.json","utf8"))}; fs.writeFileSync(p,JSON.stringify(fresh,null,2));'
          node scripts/qa-pr366-preview-ui.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui hours-preorder
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui restore-preorder .preview-receipt/pr366-ui/fixture-prepare-preorder.json
          node scripts/qa-pr366-preview-db-fixtures.mjs .preview-receipt/manual-resources.json .preview-receipt/ui-binding.json .preview-receipt/pr366-ui restore-circuit-b .preview-receipt/pr366-ui/fixture-enable-circuit-b.json

      - name: Preserve PR366 baseline and actual browser evidence
        if: always() && steps.preview-approval.outcome == 'success' && github.event_name == 'workflow_dispatch' && env.PREVIEW_GIT_BRANCH == 'codex/integrated-production-20261002'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr366-browser-qa-${{ github.run_id }}
          path: |
            .preview-receipt/primary-baseline.json
            .preview-receipt/ui-binding.json
            .preview-receipt/pr366-ui/
          if-no-files-found: warn

      - name: Run matching Preview read-only smoke
        if: steps.vercel-auth.outputs.enabled == 'true'
        env:
          PRODUCTION_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          SMOKE_SKIP_DOMAIN_REDIRECTS: "true"
          PRODUCTION_TEST_QR_REQUIRED: "false"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run production:smoke

      - name: Run isolated catalog translation glossary smoke
        if: steps.vercel-auth.outputs.enabled == 'true' && steps.vercel-preview.outputs.translation_enabled == 'true' && env.PREVIEW_GIT_BRANCH != 'codex/line-platform-oa-v2-20260927'
        env:
          CATALOG_TRANSLATION_SYNTHETIC_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          CATALOG_TRANSLATION_SYNTHETIC_CONFIRMATION: EPHEMERAL_PREVIEW_ONLY
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run preview:catalog-translation-smoke

      - name: Run synthetic OAuth and delivery smoke tests
        if: steps.vercel-auth.outputs.enabled == 'true'
        env:
          DELIVERY_SYNTHETIC_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          DELIVERY_SYNTHETIC_CONFIRMATION: EPHEMERAL_PREVIEW_ONLY
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run preview:delivery-smoke

      - name: Clean reusable Preview-only fixture state
        if: always() && steps.preview-approval.outcome == 'success' && env.EPHEMERAL_DATABASE_URL != ''
        run: |
          supabase db query \
            --db-url "$EPHEMERAL_DATABASE_URL" \
            --file supabase/fixtures/delivery_mock_preview_cleanup.sql \
            --log-level error

      - name: Enable isolated live LINE login for short-lived Pull Request Preview
        if: github.event_name == 'pull_request' && steps.vercel-preview.outputs.line_live_enabled == 'true' && success()
        run: |
          test "${{ steps.preview.outputs.branch_ref }}" != "$SUPABASE_PARENT_PROJECT_REF" || {
            echo "::error::Refusing to enable LINE login on the parent Supabase project."
            exit 1
          }
          supabase db query \
            --db-url "$EPHEMERAL_DATABASE_URL" \
            --file supabase/fixtures/line_live_preview.sql \
            --log-level error

      - name: Clean exact manual Preview resources and verify absence
        if: always() && steps.preview-approval.outcome == 'success' && github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/manual-preview-cleanup.mjs cleanup

      - name: Upload final manual Preview cleanup or recovery receipt
        if: always() && steps.preview-approval.outcome == 'success' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-preview-final-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: warn

  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_external_preview == true &&
      inputs.operation == 'cleanup' &&
      inputs.cleanup_pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: Preview
    env:
      DO_NOT_TRACK: "1"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PARENT_PROJECT_REF }}
      PREVIEW_BRANCH_NAME: pr-${{ inputs.cleanup_pr_number }}-oauth-delivery
      PREVIEW_RESOURCE_KEY: pr-${{ inputs.cleanup_pr_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate exact cleanup owner
        env:
          CLEANUP_PR_NUMBER: ${{ inputs.cleanup_pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CLEANUP_PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || exit 1
          test "$PREVIEW_RESOURCE_KEY" = "pr-$CLEANUP_PR_NUMBER" || exit 1
          test "$PREVIEW_BRANCH_NAME" = "pr-$CLEANUP_PR_NUMBER-oauth-delivery" || exit 1
          pull_request="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$CLEANUP_PR_NUMBER")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --argjson number "$CLEANUP_PR_NUMBER" \
            '.state == "closed" and .number == $number and .head.repo.full_name == $repository' \
            <<<"$pull_request" >/dev/null || exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify actual Preview required-reviewers protection
        id: preview-approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/awesome-optimization/preview-approval.mjs

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 branch
        with:
          version: 2.109.1

      - name: Remove closed Pull Request Vercel Previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] \
            || [ -z "${VERCEL_ORG_ID:-}" ] \
            || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            exit 0
          fi
          mkdir -p .vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' > .vercel/project.json
          deployments="$(
            npx --yes vercel@58.3.0 list "$VERCEL_PROJECT_ID" \
              --meta "stallorderPreviewResource=$PREVIEW_RESOURCE_KEY" \
              --limit 100 \
              --json \
              --token "$VERCEL_TOKEN"
          )"
          jq -e '(.deployments | type) == "array"' <<<"$deployments" >/dev/null || {
            echo "::error::Unexpected Vercel deployment list response."
            exit 1
          }
          while IFS= read -r deployment_url; do
            [ -n "$deployment_url" ] || continue
            if npx --yes vercel@58.3.0 remove "$deployment_url" \
              --yes \
              --token "$VERCEL_TOKEN"; then
              echo "Removed Vercel Preview $deployment_url."
            else
              echo "::warning::Vercel Preview removal returned nonzero for $deployment_url; verifying final state."
            fi
          done < <(
            jq -r '.deployments[]?.url // empty' \
              <<<"$deployments" | sort -u
          )
          remaining="$(
            npx --yes vercel@58.3.0 list "$VERCEL_PROJECT_ID" \
              --meta "stallorderPreviewResource=$PREVIEW_RESOURCE_KEY" \
              --limit 100 \
              --json \
              --token "$VERCEL_TOKEN"
          )"
          jq -e '(.deployments | type) == "array"' <<<"$remaining" >/dev/null || {
            echo "::error::Unexpected Vercel deployment list response after cleanup."
            exit 1
          }
          jq -e '.deployments | length == 0' <<<"$remaining" >/dev/null || {
            echo "::error::Matching Vercel Preview deployments remain after cleanup."
            exit 1
          }

      - name: Remove closed Pull Request Preview Branch
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || exit 0
          test -n "${SUPABASE_PARENT_PROJECT_REF:-}" || exit 0
          supabase branches delete "$PREVIEW_BRANCH_NAME" \
            --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
            --yes \
            --log-level error || true


  cleanup-manual-run:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_external_preview == true &&
      inputs.operation == 'cleanup-manual-run' &&
      inputs.cleanup_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: manual-preview-recovery-${{ inputs.cleanup_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment:
      name: Preview
    env:
      CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PARENT_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify actual Preview required-reviewers protection
        id: preview-approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/awesome-optimization/preview-approval.mjs
      - name: Read exact completed source run and its recovery artifacts
        shell: bash
        run: |
          [[ "$CLEANUP_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$VERCEL_TOKEN"
          mkdir -p .manual-recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLEANUP_RUN_ID" > .manual-recovery/source-run.json
          jq -e --arg id "$CLEANUP_RUN_ID" --arg repo "$GITHUB_REPOSITORY" '
            (.id | tostring) == $id and .repository.full_name == $repo and
            .event == "workflow_dispatch" and .status == "completed" and
            .path == ".github/workflows/ephemeral-preview.yml"
          ' .manual-recovery/source-run.json >/dev/null
          gh run download "$CLEANUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "manual-preview-*-$CLEANUP_RUN_ID" --dir .manual-recovery
          node scripts/manual-preview-recovery.mjs .manual-recovery/source-run.json .manual-recovery
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 branch
        with:
          version: 2.109.1
      - name: Clean and read back only the verified original manual run resources
        run: node scripts/manual-preview-cleanup.mjs cleanup
      - name: Preserve exact recovery cleanup or failure receipt
        if: always() && steps.preview-approval.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-preview-recovery-${{ inputs.cleanup_run_id }}-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: warn

  resume-manual-run:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_external_preview == true &&
      inputs.operation == 'resume-manual-run' &&
      inputs.cleanup_run_id == '37103994917' &&
      github.ref_name == 'codex/integrated-production-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: manual-preview-recovery-${{ inputs.cleanup_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment:
      name: Preview
    env:
      CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PARENT_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PREVIEW_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify actual Preview required-reviewers protection
        id: preview-approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/awesome-optimization/preview-approval.mjs
      - name: Recover exact original completed run receipt without extending expiry
        run: |
          mkdir -p .manual-recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLEANUP_RUN_ID" > .manual-recovery/source-run.json
          gh run download "$CLEANUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "manual-preview-*-$CLEANUP_RUN_ID" --dir .manual-recovery
          gh run download "$CLEANUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "pr366-browser-qa-$CLEANUP_RUN_ID" --dir .manual-recovery/browser
          node scripts/manual-preview-recovery.mjs .manual-recovery/source-run.json .manual-recovery
          cp .manual-recovery/browser/primary-baseline.json .preview-receipt/primary-baseline.json
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.109.1
      - name: Capture and verify the existing original resource pair
        run: node scripts/manual-preview-cleanup.mjs capture
      - name: Preserve exact recovered ownership
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-preview-resume-owned-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: error
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx playwright install --with-deps chromium
      - name: Verify runtime equivalence and test the original paired Preview
        run: bash scripts/qa-pr366-preview-resume.sh
      - name: Preserve actual resumed browser and database evidence
        if: always() && steps.preview-approval.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr366-resumed-browser-qa-${{ github.run_id }}
          path: |
            .preview-receipt/primary-baseline.json
            .preview-receipt/runtime-equivalence.json
            .preview-receipt/ui-binding.json
            .preview-receipt/pr366-ui/
          if-no-files-found: warn
      - name: Clean the original exact pair and verify absence
        if: always() && steps.preview-approval.outcome == 'success'
        run: node scripts/manual-preview-cleanup.mjs cleanup
      - name: Preserve exact resumed cleanup receipt
        if: always() && steps.preview-approval.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-preview-resume-final-${{ github.run_id }}
          path: .preview-receipt/manual-resources.json
          if-no-files-found: warn
