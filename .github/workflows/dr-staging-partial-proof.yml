name: Read-only partial DR retirement evidence

on:
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: Explicit evidence transport; never renews the consumed Plan
        type: choice
        required: true
        default: current-artifact
        options:
          - current-artifact
          - consumed-plan-history-v1

permissions:
  contents: read
  actions: read

concurrency:
  group: production-dr-operations
  cancel-in-progress: false

jobs:
  readonly-proof:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch current Staging source
        run: git fetch origin staging
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate diagnostic entry and reader contracts
        run: npx vitest run scripts/staging-partial-retirement-*.test.mjs scripts/dr-staging-source-checks.test.mjs scripts/staging-workflow-contract.test.mjs scripts/staging-plan-history.test.mjs
      - name: Create fresh isolated copy
        shell: bash
        run: |
          set -euo pipefail
          image=public.ecr.aws/supabase/postgres@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453
          name="dr-staging-partial-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_local() { env -i PATH="$PATH" docker --host unix:///var/run/docker.sock "$@"; }
          test -z "$(docker_local ps -aq --filter "name=^/${name}$")"
          docker_local pull --platform linux/amd64 "$image"
          password=$(openssl rand -hex 24)
          id=$(docker_local create --platform linux/amd64 --name "$name" --label owner=dr-staging-transition-20261022 --label task=staging-partial-retirement-proof --label "proof-run=${GITHUB_RUN_ID}" --network none --ipc private --memory 1536m --cpus 2 --env "POSTGRES_PASSWORD=$password" "$image")
          [[ "$id" =~ ^[a-f0-9]{64}$ ]]
          printf 'PARTIAL_PROOF_CONTAINER=%s\n' "$id" >> "$GITHUB_ENV"
          unset password
          docker_local start "$id" > /dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if docker_local exec "$id" pg_isready -h 127.0.0.1 -U supabase_admin > /dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Observe authenticated partial state without remote writes
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          PARTIAL_PROOF_EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          DR_STAGING_CONSUMED_PLAN_39944190461_ZIP_BASE64: ${{ inputs.evidence_mode == 'consumed-plan-history-v1' && secrets.DR_STAGING_CONSUMED_PLAN_39944190461_ZIP_BASE64 || '' }}
        run: node scripts/staging-partial-retirement-readonly.mjs
      - name: Stop exact isolated copy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PARTIAL_PROOF_CONTAINER:-}"; then
            [[ "$PARTIAL_PROOF_CONTAINER" =~ ^[a-f0-9]{64}$ ]]
            docker_local() { env -i PATH="$PATH" docker --host unix:///var/run/docker.sock "$@"; }
            test "$(docker_local inspect -f '{{ index .Config.Labels "owner" }}' "$PARTIAL_PROOF_CONTAINER")" = dr-staging-transition-20261022
            test "$(docker_local inspect -f '{{ index .Config.Labels "task" }}' "$PARTIAL_PROOF_CONTAINER")" = staging-partial-retirement-proof
            test "$(docker_local inspect -f '{{ index .Config.Labels "proof-run" }}' "$PARTIAL_PROOF_CONTAINER")" = "$GITHUB_RUN_ID"
            docker_local stop "$PARTIAL_PROOF_CONTAINER" > /dev/null
            test "$(docker_local inspect -f '{{.State.Running}}' "$PARTIAL_PROOF_CONTAINER")" = false
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-retirement-diagnostic-${{ github.run_id }}
          path: artifacts/partial-proof-public/receipt.json
          if-no-files-found: error
          retention-days: 14
