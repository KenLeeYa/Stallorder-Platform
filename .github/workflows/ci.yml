name: CI

on:
  workflow_call:
    inputs:
      regression_only:
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Eight sequential shards share one local stack; retain every test and failure result.
    timeout-minutes: 120
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-13
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 branch
        with:
          version: 2.109.1
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Check browser/native/shared boundaries and local-only external defaults
        run: |
          npm run optimize:external-check
          node scripts/awesome-optimization/boundaries.mjs
      - name: Source credential patterns and dependency license inventory
        run: node scripts/security-compliance-check.mjs
      - name: Dependency SBOM
        run: npm sbom --sbom-format cyclonedx --package-lock-only > security-sbom.cdx.json
      - name: Lint
        run: npm run lint
      - name: UI control audit
        run: npm run ui:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Unit tests
        run: npm test
      - name: Start local Supabase
        run: npx supabase start
      - name: Configure local E2E runtime
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          for entry in \
            "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" \
            "PRIMARY_SUPABASE_URL=${API_URL}" \
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" \
            "SUPABASE_SECRET_KEY=${SERVICE_ROLE_KEY}" \
            "PRIMARY_SUPABASE_SECRET_KEY=${SERVICE_ROLE_KEY}"; do
            value="${entry#*=}"
            echo "::add-mask::${value}"
            echo "${entry}" >> "$GITHUB_ENV"
          done
          for name in \
            AUDIT_IP_HASH_SECRET \
            SESSION_FINGERPRINT_HASH_SECRET \
            OFFLINE_PERMIT_SIGNING_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Rebuild local database from migrations
        run: npx supabase db reset
      - name: Database tests
        run: npm run db:test
      - name: Public cart replay database regression
        env:
          PLAYWRIGHT_APP_URL: http://127.0.0.1:3000
        run: node scripts/qa-public-order-original-items-local.mjs
      - name: Database lint
        run: npx supabase db lint --local --level warning --fail-on warning
      - name: Production guardrails
        run: npm run production:check
      - name: Enable local legacy Google OAuth compatibility
        run: |
          supabase db query \
            --db-url "$DATABASE_URL" \
            --file supabase/fixtures/oauth_legacy_google_e2e.sql \
            --log-level error
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Verify independent status Worker bundle
        run: npm run status:check
      - name: Playwright end-to-end tests
        if: inputs.regression_only != true
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "true"
          PLAYWRIGHT_APP_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Focused integrated release regressions
        if: inputs.regression_only == true
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "true"
          PLAYWRIGHT_APP_URL: http://127.0.0.1:3000
          PLAYWRIGHT_TRUSTED_CLIENT_IP: 203.0.113.201
        run: >-
          npx concurrently --kill-others --success command-1
          "npm run functions:serve:e2e"
          "playwright test e2e/dine-in-order-flow.spec.ts e2e/ordering-selection.spec.ts e2e/p2-growth-tools.spec.ts e2e/product-bundles.spec.ts e2e/qr-manual-pickup-cash-checkout.spec.ts e2e/staff-pos-line-delivery.spec.ts e2e/product-availability-recovery.spec.ts e2e/staff-order-edit-regression.spec.ts e2e/reusable-note-navigation-local.spec.ts e2e/catalog-product-list-preview-regression.spec.ts e2e/notification-filter-regression.spec.ts e2e/preview-harness-lifecycle.spec.ts e2e/public-cache.spec.ts e2e/theme-toggle.spec.ts"
      - name: Production-mode resilience smoke
        run: npm run test:e2e:resilience:production
      - name: Dependency audit
        run: |
          npm install --global npm@11.16.0
          npm ci --workspace packages/contracts --include-workspace-root --include=dev
          node scripts/verify-web-release-scope.mjs web-release-evidence
      - name: Preserve failed E2E evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve fresh Web scope evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-release-scope-${{ github.run_id }}-${{ github.job }}
          path: web-release-evidence/
          if-no-files-found: warn
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
