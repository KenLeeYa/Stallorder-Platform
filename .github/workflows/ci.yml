name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: UI control audit
        run: npm run ui:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Start local Supabase
        run: npx supabase start
      - name: Rebuild local database from migrations
        run: npx supabase db reset
      - name: Database tests
        run: npm run db:test
      - name: Database lint
        run: npx supabase db lint --local --level warning --fail-on warning
      - name: Production guardrails
        run: npm run production:check
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
