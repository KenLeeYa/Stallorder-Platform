name: Production DR Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production DR operation
        required: true
        type: choice
        options:
          - plan-bootstrap
          - bootstrap
          - plan-drill
          - drill
          - plan-storage-canary
          - storage-canary
      confirmation:
        description: Type PLAN_PRODUCTION_DR or the operation-specific Apply confirmation
        required: true
        type: string
      plan_run_id:
        description: Successful matching Plan run ID required for Apply operations
        required: false
        type: string
        default: ""
      resume_backup_run_id:
        description: Prior successful encrypted former-Staging backup run to reuse
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: production-dr-operations
  cancel-in-progress: false

env:
  PRIMARY_SUPABASE_PROJECT_REF: ${{ vars.PRIMARY_SUPABASE_PROJECT_REF }}
  DR_SUPABASE_PROJECT_REF: ${{ vars.DR_SUPABASE_PROJECT_REF }}
  APP_BASE_URL: ${{ vars.APP_BASE_URL }}
  FAILOVER_ACTOR_EMAIL: ada76145@gmail.com
  PRODUCTION_ENVIRONMENT_APPROVED: "true"

jobs:
  plan:
    if: "${{ startsWith(inputs.operation, 'plan-') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate Production DR plan invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production DR plans must run from main."
            exit 1
          }
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
            echo "::error::Only the repository owner may create a Production plan."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "PLAN_PRODUCTION_DR" || {
            echo "::error::Confirmation must be PLAN_PRODUCTION_DR."
            exit 1
          }
          if [ "${{ inputs.operation }}" = "plan-bootstrap" ] \
            && [ -n "${{ inputs.resume_backup_run_id }}" ]; then
            [[ "${{ inputs.resume_backup_run_id }}" =~ ^[1-9][0-9]{0,19}$ ]] || {
              echo "::error::resume_backup_run_id must contain digits only."
              exit 1
            }
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build read-only DR operation plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ inputs.operation }}" in
            plan-bootstrap)
              node scripts/configure-dr-replication.mjs \
                --source PRIMARY --target DR \
                > artifacts/production-dr-operation-plan.json
              echo "PRODUCTION_APPROVAL_OPERATION=production-dr-bootstrap" >> "$GITHUB_ENV"
              printf 'PRODUCTION_APPROVAL_PARAMETERS_JSON={"resumeBackupRunId":"%s"}\n' \
                "${{ inputs.resume_backup_run_id }}" >> "$GITHUB_ENV"
              ;;
            plan-drill)
              node scripts/check-dr-readiness.mjs --target DR \
                > artifacts/production-dr-operation-plan.json
              echo "PRODUCTION_APPROVAL_OPERATION=production-dr-drill" >> "$GITHUB_ENV"
              echo 'PRODUCTION_APPROVAL_PARAMETERS_JSON={}' >> "$GITHUB_ENV"
              ;;
            plan-storage-canary)
              node scripts/run-storage-replication-canary.mjs \
                > artifacts/production-dr-operation-plan.json
              echo "PRODUCTION_APPROVAL_OPERATION=production-storage-canary" >> "$GITHUB_ENV"
              echo 'PRODUCTION_APPROVAL_PARAMETERS_JSON={}' >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported Production DR plan operation."
              exit 1
              ;;
          esac

      - name: Create immutable Production plan receipt
        env:
          PRODUCTION_APPROVAL_RECEIPT_PATH: artifacts/production-approval.json
        run: node scripts/production-approval.mjs create

      - name: Upload Production DR plan
        uses: actions/upload-artifact@v4
        with:
          name: production-dr-plan-${{ github.run_id }}
          path: |
            artifacts/production-dr-operation-plan.json
            artifacts/production-approval.json
          if-no-files-found: error
          retention-days: 1

  approval:
    if: >-
      inputs.operation == 'bootstrap' ||
      inputs.operation == 'drill' ||
      inputs.operation == 'storage-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate manual Production apply invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production DR apply must run from main."
            exit 1
          }
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
            echo "::error::Only the repository owner may confirm Production apply."
            exit 1
          }
          [[ "${{ inputs.plan_run_id }}" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::Apply requires the successful matching Plan run ID."
            exit 1
          }
          case "${{ inputs.operation }}:${{ inputs.confirmation }}" in
            bootstrap:CREATE_PRODUCTION_DR)
              echo "PRODUCTION_APPROVAL_OPERATION=production-dr-bootstrap" >> "$GITHUB_ENV"
              printf 'PRODUCTION_APPROVAL_PARAMETERS_JSON={"resumeBackupRunId":"%s"}\n' \
                "${{ inputs.resume_backup_run_id }}" >> "$GITHUB_ENV"
              ;;
            drill:MEASURE_PRODUCTION_DR)
              echo "PRODUCTION_APPROVAL_OPERATION=production-dr-drill" >> "$GITHUB_ENV"
              echo 'PRODUCTION_APPROVAL_PARAMETERS_JSON={}' >> "$GITHUB_ENV"
              ;;
            storage-canary:PROVE_STORAGE_DR)
              echo "PRODUCTION_APPROVAL_OPERATION=production-storage-canary" >> "$GITHUB_ENV"
              echo 'PRODUCTION_APPROVAL_PARAMETERS_JSON={}' >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Apply confirmation does not match the selected operation."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download approved Production DR plan
        uses: actions/download-artifact@v4
        with:
          name: production-dr-plan-${{ inputs.plan_run_id }}
          path: approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify manual approval is bound to the immutable plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVAL_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PRODUCTION_APPROVAL_RECEIPT_PATH: approved-plan/production-approval.json
        run: node scripts/production-approval.mjs verify

  bootstrap:
    needs: approval
    if: "${{ inputs.operation == 'bootstrap' && needs.approval.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DR_SUPABASE_DB_PASSWORD: ${{ secrets.DR_SUPABASE_DB_PASSWORD }}
      PRIMARY_REPLICATION_PASSWORD: ${{ secrets.PRIMARY_REPLICATION_PASSWORD }}
      DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
      RESUME_BACKUP_RUN_ID: ${{ inputs.resume_backup_run_id }}
    steps:
      - name: Validate protected invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production DR operations must run from main."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "CREATE_PRODUCTION_DR" || {
            echo "::error::Confirmation must be CREATE_PRODUCTION_DR."
            exit 1
          }
          if [ -n "$RESUME_BACKUP_RUN_ID" ] && [[ ! "$RESUME_BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::resume_backup_run_id must contain digits only."
            exit 1
          fi
          for name in \
            SUPABASE_ACCESS_TOKEN \
            DR_SUPABASE_DB_PASSWORD \
            PRIMARY_REPLICATION_PASSWORD \
            DR_BACKUP_ENCRYPTION_KEY \
            PRIMARY_SUPABASE_PROJECT_REF \
            DR_SUPABASE_PROJECT_REF \
            APP_BASE_URL
          do
            test -n "${!name:-}" || {
              echo "::error::Missing protected configuration: ${name}"
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - name: Download verified former Staging backup
        if: inputs.resume_backup_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: production-dr-encrypted-backups-${{ inputs.resume_backup_run_id }}
          path: dr-resume-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_backup_run_id }}

      - name: Validate resumed former Staging backup
        if: inputs.resume_backup_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verification=dr-resume-artifacts/backup-verification.json
          inventory=dr-resume-artifacts/pre-conversion-inventory.json
          test -f "$verification"
          test -f "$inventory"
          jq -e \
            --arg run_id "$RESUME_BACKUP_RUN_ID" \
            '.runId == $run_id
              and .formerStagingRestoreTest == true
              and .encrypted == true' \
            "$verification" >/dev/null
          jq -e \
            '(.formerStagingAuthUsers | type) == "number"
              and .formerStagingStorageObjects == 0' \
            "$inventory" >/dev/null
          artifact_commit="$(jq -r '.commit' "$verification")"
          run_metadata="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_BACKUP_RUN_ID}"
          )"
          jq -e \
            --arg artifact_commit "$artifact_commit" \
            '.path == ".github/workflows/production-dr-operations.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .head_sha == $artifact_commit' \
            <<<"$run_metadata" >/dev/null
          git merge-base --is-ancestor "$artifact_commit" HEAD
          mapfile -t checksums < <(
            find dr-resume-artifacts -maxdepth 1 -type f \
              -name 'former-staging-*.dump.enc.sha256' \
              -print | sort
          )
          mapfile -t encrypted_archives < <(
            find dr-resume-artifacts -maxdepth 1 -type f \
              -name 'former-staging-*.dump.enc' \
              -print | sort
          )
          test "${#checksums[@]}" = "3"
          test "${#encrypted_archives[@]}" = "3"
          for checksum_file in "${checksums[@]}"; do
            encrypted_file="${checksum_file%.sha256}"
            test -f "$encrypted_file"
            expected_hash="$(cut -d ' ' -f 1 "$checksum_file")"
            printf '%s  %s\n' "$expected_hash" "$encrypted_file" |
              sha256sum --check --status -
          done
          install -d -m 700 dr-resume-verify
          cleanup_resume_plaintext() {
            find dr-resume-verify -maxdepth 1 -type f -exec shred -u {} +
            rmdir dr-resume-verify 2>/dev/null || true
          }
          trap cleanup_resume_plaintext EXIT
          docker pull postgres:17 >/dev/null
          for encrypted_file in "${encrypted_archives[@]}"; do
            decrypted_file="dr-resume-verify/$(basename "${encrypted_file%.enc}")"
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "$encrypted_file" \
              -out "$decrypted_file" \
              -pass env:DR_BACKUP_ENCRYPTION_KEY
            docker run --rm \
              -v "$PWD/dr-resume-verify:/out" postgres:17 \
              pg_restore --list "/out/$(basename "$decrypted_file")" >/dev/null
            shred -u "$decrypted_file"
          done
          cleanup_resume_plaintext
          trap - EXIT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - run: npm ci

      - name: Build protected database URLs
        run: node scripts/export-dr-database-urls.mjs

      - name: Create encrypted logical backups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dr-artifacts
          docker pull postgres:17 >/dev/null

          run_pg_dump() {
            local database_url="$1"
            shift
            DATABASE_URL="$database_url" docker run --rm --network host \
              --env DATABASE_URL \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              sh -ceu 'exec pg_dump --dbname "$DATABASE_URL" "$@"' sh "$@"
          }
          run_psql_scalar() {
            local database_url="$1"
            local query="$2"
            DATABASE_URL="$database_url" docker run --rm --network host \
              --env DATABASE_URL postgres:17 \
              sh -ceu 'exec psql --dbname "$DATABASE_URL" --tuples-only --no-align --command "$1"' sh "$query"
          }

          run_pg_dump "$DIRECT_URL" \
            --schema public \
            --format custom \
            --compress 6 \
            --no-owner \
            --no-acl \
            --file /out/primary-public.dump
          run_pg_dump "$DIRECT_URL" \
            --schema public \
            --data-only \
            --format custom \
            --compress 6 \
            --no-owner \
            --no-acl \
            --file /out/primary-public-data.dump
          run_pg_dump "$DIRECT_URL" \
            --schema auth \
            --schema storage \
            --data-only \
            --format custom \
            --compress 6 \
            --no-owner \
            --no-acl \
            --file /out/primary-auth-storage-data.dump
          primary_auth_users="$(
            run_psql_scalar "$DIRECT_URL" "select count(*) from auth.users"
          )"
          primary_storage_objects="$(
            run_psql_scalar "$DIRECT_URL" "select count(*) from storage.objects"
          )"

          if [ -z "$RESUME_BACKUP_RUN_ID" ]; then
            run_pg_dump "$DR_DIRECT_URL" \
              --schema public \
              --format custom \
              --compress 6 \
              --no-owner \
              --no-acl \
              --file /out/former-staging-public.dump
            run_pg_dump "$DR_DIRECT_URL" \
              --schema public \
              --data-only \
              --format custom \
              --compress 6 \
              --no-owner \
              --no-acl \
              --file /out/former-staging-public-data.dump
            run_pg_dump "$DR_DIRECT_URL" \
              --schema auth \
              --schema storage \
              --data-only \
              --format custom \
              --compress 6 \
              --no-owner \
              --no-acl \
              --file /out/former-staging-auth-storage-data.dump
            former_staging_auth_users="$(
              run_psql_scalar "$DR_DIRECT_URL" "select count(*) from auth.users"
            )"
            former_staging_storage_objects="$(
              run_psql_scalar "$DR_DIRECT_URL" "select count(*) from storage.objects"
            )"
          else
            former_staging_auth_users="$(
              jq -r '.formerStagingAuthUsers' \
                dr-resume-artifacts/pre-conversion-inventory.json
            )"
            former_staging_storage_objects="$(
              jq -r '.formerStagingStorageObjects' \
                dr-resume-artifacts/pre-conversion-inventory.json
            )"
          fi
          for archive in dr-artifacts/*.dump; do
            docker run --rm \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              pg_restore --list "/out/$(basename "$archive")" >/dev/null
          done
          test "$primary_storage_objects" = "0" || {
            echo "::error::Primary Storage contains objects; bootstrap requires the reviewed byte-mirror migration first."
            exit 1
          }
          test "$former_staging_storage_objects" = "0" || {
            echo "::error::Former Staging Storage contains objects; bootstrap will not delete unarchived bytes."
            exit 1
          }
          cat > dr-artifacts/pre-conversion-inventory.json <<JSON
          {
            "primaryAuthUsers": ${primary_auth_users},
            "primaryStorageObjects": ${primary_storage_objects},
            "formerStagingAuthUsers": ${former_staging_auth_users},
            "formerStagingStorageObjects": ${former_staging_storage_objects}
          }
          JSON

      - name: Restore-test both logical backups
        shell: bash
        run: |
          set -euo pipefail
          npx supabase start
          npx supabase db reset --local --no-seed
          cat > dr-artifacts/prepare-public-restore.sql <<'SQL'
          do $$
          declare
            relations text;
            target record;
          begin
            select string_agg(format('%I.%I', schemaname, tablename), ', ')
            into relations
            from pg_catalog.pg_tables
            where schemaname = 'public';
            if relations is not null then
              execute 'truncate table ' || relations || ' cascade';
            end if;
            for target in
              select schemaname, tablename
              from pg_catalog.pg_tables
              where schemaname = 'public'
            loop
              execute format(
                'alter table %I.%I disable trigger user',
                target.schemaname,
                target.tablename
              );
            end loop;
          end
          $$;
          SQL
          cat > dr-artifacts/enable-public-user-triggers.sql <<'SQL'
          do $$
          declare
            target record;
          begin
            for target in
              select schemaname, tablename
              from pg_catalog.pg_tables
              where schemaname = 'public'
            loop
              execute format(
                'alter table %I.%I enable trigger user',
                target.schemaname,
                target.tablename
              );
            end loop;
          end
          $$;
          SQL
          export PGPASSWORD=postgres
          docker run --rm --network host --env PGPASSWORD \
            -v "$PWD/dr-artifacts:/out" postgres:17 \
            psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --file /out/prepare-public-restore.sql
          docker run --rm --network host --env PGPASSWORD \
            -v "$PWD/dr-artifacts:/out" postgres:17 \
            pg_restore \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --data-only \
              --schema auth \
              --table users \
              --no-owner \
              --no-acl \
              --single-transaction \
              --exit-on-error \
              /out/primary-auth-storage-data.dump
          docker run --rm --network host --env PGPASSWORD \
            -v "$PWD/dr-artifacts:/out" postgres:17 \
            pg_restore \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --data-only \
              --no-owner \
              --no-acl \
              --single-transaction \
              --exit-on-error \
              /out/primary-public-data.dump
          docker run --rm --network host --env PGPASSWORD \
            -v "$PWD/dr-artifacts:/out" postgres:17 \
            psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --file /out/enable-public-user-triggers.sql
          docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --tuples-only \
              --command "select count(*) > 0 from public.profiles" \
            | grep -q t

          if [ -z "$RESUME_BACKUP_RUN_ID" ]; then
            npx supabase db reset --local --no-seed
            docker run --rm --network host --env PGPASSWORD \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              psql \
                --host 127.0.0.1 \
                --port 54322 \
                --username postgres \
                --dbname postgres \
                --set ON_ERROR_STOP=1 \
                --file /out/prepare-public-restore.sql
            docker run --rm --network host --env PGPASSWORD \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              pg_restore \
                --host 127.0.0.1 \
                --port 54322 \
                --username postgres \
                --dbname postgres \
                --data-only \
                --schema auth \
                --table users \
                --no-owner \
                --no-acl \
                --single-transaction \
                --exit-on-error \
                /out/former-staging-auth-storage-data.dump
            docker run --rm --network host --env PGPASSWORD \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              pg_restore \
                --host 127.0.0.1 \
                --port 54322 \
                --username postgres \
                --dbname postgres \
                --data-only \
                --no-owner \
                --no-acl \
                --single-transaction \
                --exit-on-error \
                /out/former-staging-public-data.dump
            docker run --rm --network host --env PGPASSWORD \
              -v "$PWD/dr-artifacts:/out" postgres:17 \
              psql \
                --host 127.0.0.1 \
                --port 54322 \
                --username postgres \
                --dbname postgres \
                --set ON_ERROR_STOP=1 \
                --file /out/enable-public-user-triggers.sql
          fi
          unset PGPASSWORD
          npx supabase stop --no-backup

      - name: Encrypt backup artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RESUME_BACKUP_RUN_ID" ]; then
            cp dr-resume-artifacts/former-staging-*.dump.enc \
              dr-resume-artifacts/former-staging-*.dump.enc.sha256 \
              dr-artifacts/
            cp dr-resume-artifacts/backup-verification.json \
              dr-artifacts/resumed-former-staging-backup-verification.json
          fi
          sudo chown "$(id -u):$(id -g)" dr-artifacts/*.dump
          for file in dr-artifacts/*.dump; do
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "$file" \
              -out "${file}.enc" \
              -pass env:DR_BACKUP_ENCRYPTION_KEY
            sha256sum "${file}.enc" > "${file}.enc.sha256"
            shred -u "$file"
          done
          rm -f \
            dr-artifacts/prepare-public-restore.sql \
            dr-artifacts/enable-public-user-triggers.sql
          for checksum_file in dr-artifacts/*.dump.enc.sha256; do
            sha256sum --check --status "$checksum_file"
          done
          cat > dr-artifacts/backup-verification.json <<JSON
          {
            "runId": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "primaryRestoreTest": true,
            "formerStagingRestoreTest": true,
            "resumedFormerStagingBackupRunId": "${RESUME_BACKUP_RUN_ID}",
            "encrypted": true
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: production-dr-encrypted-backups-${{ github.run_id }}
          path: dr-artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Remove incomplete logical replication from a prior bootstrap
        env:
          DR_CHANGE_CONFIRMATION: ROLLBACK_PRIMARY_TO_DR
        run: node scripts/configure-dr-replication.mjs --source PRIMARY --target DR --rollback

      - name: Remove standalone application sequences before DR reset
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$DR_DIRECT_URL" docker run --rm --network host \
            --env DATABASE_URL \
            postgres:17 \
            sh -ceu 'exec psql --dbname "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "$1"' sh '
              drop sequence if exists public.invoice_number_seq cascade;
              drop sequence if exists public.merchant_application_number_seq cascade;
            '

      - name: Reset former Staging into an empty DR schema
        run: supabase db reset --db-url "$DR_DIRECT_URL" --no-seed --yes

      - name: Configure Supabase DR project
        env:
          DR_CHANGE_CONFIRMATION: CONFIGURE_PRODUCTION_DR_PROJECT
        run: node scripts/configure-production-dr-project.mjs

      - name: Deploy trusted Edge Functions to DR
        run: supabase functions deploy --project-ref "$DR_SUPABASE_PROJECT_REF" --use-api --import-map supabase/functions/deno.json

      - name: Initialize writer fencing and replication role
        env:
          DR_CHANGE_CONFIRMATION: INITIALIZE_PRODUCTION_DR
        run: node scripts/initialize-production-dr.mjs

      - name: Configure Primary to DR logical replication
        env:
          DR_CHANGE_CONFIRMATION: CONFIGURE_PRIMARY_TO_DR
        run: node scripts/configure-dr-replication.mjs --source PRIMARY --target DR --apply

      - name: Wait for initial copy and capture RPO canary
        run: node scripts/refresh-dr-replication-snapshot.mjs --create-canary --drill-id bootstrap --wait-seconds 1200

      - name: Reserve DR sequences
        env:
          DR_CHANGE_CONFIRMATION: RESERVE_DR_SEQUENCES
        run: node scripts/reserve-dr-sequences.mjs

      - name: Refresh final bootstrap snapshot
        run: node scripts/refresh-dr-replication-snapshot.mjs --wait-seconds 300

      - name: Verify DR readiness
        env:
          DR_CHANGE_CONFIRMATION: CHECK_DR_READINESS
          DR_AUTH_READY: "true"
          DR_EDGE_FUNCTIONS_READY: "true"
          DR_TURNSTILE_READY: "true"
          DR_PAYMENT_CALLBACK_READY: "true"
          DR_NO_ACTIVE_MIGRATION_CONFIRMED: "true"
        run: node scripts/check-dr-readiness.mjs --target DR --apply

  drill:
    needs: approval
    if: "${{ inputs.operation == 'drill' && needs.approval.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DR_SUPABASE_DB_PASSWORD: ${{ secrets.DR_SUPABASE_DB_PASSWORD }}
      PRIMARY_REPLICATION_PASSWORD: ${{ secrets.PRIMARY_REPLICATION_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DR_AUTH_READY: "true"
      DR_EDGE_FUNCTIONS_READY: "true"
      DR_TURNSTILE_READY: "true"
      DR_PAYMENT_CALLBACK_READY: "true"
      DR_NO_ACTIVE_MIGRATION_CONFIRMED: "true"
      PRIMARY_BACKUP_READY: "true"
      DR_BACKUP_READY: "true"
      DR_WRITES_RECONCILED: "true"
      DR_AUTH_IDENTITIES_VALIDATED: "true"
      DR_STORAGE_VALIDATED: "true"
      DR_BUSINESS_DATA_VALIDATED: "true"
    steps:
      - name: Validate protected invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production DR operations must run from main."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "MEASURE_PRODUCTION_DR" || {
            echo "::error::Confirmation must be MEASURE_PRODUCTION_DR."
            exit 1
          }
          for name in \
            SUPABASE_ACCESS_TOKEN \
            DR_SUPABASE_DB_PASSWORD \
            PRIMARY_REPLICATION_PASSWORD \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID
          do
            test -n "${!name:-}" || {
              echo "::error::Missing protected configuration: ${name}"
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Normalize protected Vercel token
        run: node scripts/export-normalized-vercel-token.mjs

      - run: npm ci
      - run: npm install --global vercel@56.3.1

      - name: Build protected runtime environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel dr-artifacts
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          echo "DR_DRILL_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Export protected database URLs
        run: node scripts/export-dr-database-urls.mjs

      - name: Export provider runtime keys
        run: node scripts/export-dr-runtime-environment.mjs

      - name: Export approved failover actor
        run: node scripts/export-failover-actor.mjs

      - name: Enable the time-bounded failover gate
        env:
          DR_CHANGE_CONFIRMATION: ENABLE_DR_FAILOVER_FLAG
        run: node scripts/set-dr-failover-flag.mjs --enable

      - name: Prebuild Primary, DR and failback deployments
        id: deployments
        shell: bash
        run: |
          set -euo pipefail
          deploy_primary() {
            local epoch="$1"
            vercel deploy . \
              --prod \
              --skip-domain \
              --force \
              --yes \
              --token "$VERCEL_TOKEN" \
              --meta "dr_drill_id=${DR_DRILL_ID}" \
              --meta "backend_target=PRIMARY" \
              -b "BACKEND_ACTIVE_TARGET=PRIMARY" \
              -b "AUTH_PROJECT_CODE=PRIMARY" \
              -b "PROMOTION_EPOCH=${epoch}" \
              -e "BACKEND_ACTIVE_TARGET=PRIMARY" \
              -e "AUTH_PROJECT_CODE=PRIMARY" \
              -e "PROMOTION_EPOCH=${epoch}" \
              -e "DR_DATABASE_URL=${DR_RUNTIME_DATABASE_URL}" \
              -e "DR_DIRECT_URL=${DR_DIRECT_URL}" \
              -e "DR_SUPABASE_URL=${DR_SUPABASE_URL}" \
              -e "DR_SUPABASE_SECRET_KEY=${DR_SUPABASE_SECRET_KEY}" \
              -e "PRIMARY_SUPABASE_URL=${PRIMARY_SUPABASE_URL}" \
              -e "PRIMARY_SUPABASE_SECRET_KEY=${PRIMARY_SUPABASE_SECRET_KEY}" \
              -e "DR_REPLICATION_SUBSCRIPTION_NAME=stallorder_primary_to_dr"
          }
          deploy_dr() {
            vercel deploy . \
              --prod \
              --skip-domain \
              --force \
              --yes \
              --token "$VERCEL_TOKEN" \
              --meta "dr_drill_id=${DR_DRILL_ID}" \
              --meta "backend_target=DR" \
              -b "DATABASE_URL=${DR_RUNTIME_DATABASE_URL}" \
              -b "DIRECT_URL=${DR_DIRECT_URL}" \
              -b "NEXT_PUBLIC_SUPABASE_URL=${DR_SUPABASE_URL}" \
              -b "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${DR_SUPABASE_PUBLISHABLE_KEY}" \
              -b "NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=${DR_SUPABASE_FUNCTIONS_URL}" \
              -b "BACKEND_ACTIVE_TARGET=DR" \
              -b "AUTH_PROJECT_CODE=DR" \
              -b "PROMOTION_EPOCH=2" \
              -e "DATABASE_URL=${DR_RUNTIME_DATABASE_URL}" \
              -e "DIRECT_URL=${DR_DIRECT_URL}" \
              -e "NEXT_PUBLIC_SUPABASE_URL=${DR_SUPABASE_URL}" \
              -e "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${DR_SUPABASE_PUBLISHABLE_KEY}" \
              -e "NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=${DR_SUPABASE_FUNCTIONS_URL}" \
              -e "SUPABASE_SECRET_KEY=${DR_SUPABASE_SECRET_KEY}" \
              -e "PUBLIC_ORDER_FUNCTION_ORIGIN=${DR_SUPABASE_FUNCTIONS_URL}" \
              -e "BACKEND_ACTIVE_TARGET=DR" \
              -e "AUTH_PROJECT_CODE=DR" \
              -e "PROMOTION_EPOCH=2" \
              -e "DR_DATABASE_URL=${DR_RUNTIME_DATABASE_URL}" \
              -e "DR_DIRECT_URL=${DR_DIRECT_URL}" \
              -e "DR_SUPABASE_URL=${DR_SUPABASE_URL}" \
              -e "DR_SUPABASE_SECRET_KEY=${DR_SUPABASE_SECRET_KEY}" \
              -e "PRIMARY_SUPABASE_URL=${PRIMARY_SUPABASE_URL}" \
              -e "PRIMARY_SUPABASE_SECRET_KEY=${PRIMARY_SUPABASE_SECRET_KEY}" \
              -e "DR_REPLICATION_SUBSCRIPTION_NAME=stallorder_primary_to_dr"
          }
          primary_epoch_1="$(deploy_primary 1)"
          dr_epoch_2="$(deploy_dr)"
          primary_epoch_3="$(deploy_primary 3)"
          for url in "$primary_epoch_1" "$dr_epoch_2" "$primary_epoch_3"; do
            [[ "$url" == https://*.vercel.app ]] || {
              echo "::error::Vercel deployment URL was not returned."
              exit 1
            }
          done
          {
            echo "PRIMARY_EPOCH_1_DEPLOYMENT=$primary_epoch_1"
            echo "DR_EPOCH_2_DEPLOYMENT=$dr_epoch_2"
            echo "PRIMARY_EPOCH_3_DEPLOYMENT=$primary_epoch_3"
          } >> "$GITHUB_ENV"
          cat > dr-artifacts/deployments.json <<JSON
          {
            "primaryEpoch1": "$primary_epoch_1",
            "drEpoch2": "$dr_epoch_2",
            "primaryEpoch3": "$primary_epoch_3"
          }
          JSON

      - name: Promote DR-aware Primary deployment
        run: |
          vercel promote "$PRIMARY_EPOCH_1_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          EXPECTED_BACKEND=PRIMARY EXPECTED_PROMOTION_EPOCH=1 \
            node scripts/wait-for-active-backend.mjs

      - name: Capture final pre-cutover RPO canary
        run: node scripts/refresh-dr-replication-snapshot.mjs --create-canary --drill-id "$DR_DRILL_ID" --wait-seconds 300 | tee dr-artifacts/pre-cutover-rpo.json

      - name: Verify final DR readiness
        env:
          DR_CHANGE_CONFIRMATION: CHECK_DR_READINESS
        run: node scripts/check-dr-readiness.mjs --target DR --apply

      - name: Freeze Primary writes
        id: prepare
        env:
          DR_CHANGE_CONFIRMATION: PREPARE_DR_FAILOVER
        run: |
          reason="Production DR RTO RPO measurement [drill:${DR_DRILL_ID}]"
          node scripts/prepare-dr-failover.mjs \
            --target DR \
            --apply \
            --reason "$reason"
          node scripts/read-backend-runtime-state.mjs --target PRIMARY \
            | tee dr-artifacts/primary-freeze.json
          freeze_ms="$(node -e "const r=require('./dr-artifacts/primary-freeze.json');process.stdout.write(String(r.updatedAtMs))")"
          echo "PRIMARY_FREEZE_MS=$freeze_ms" >> "$GITHUB_ENV"

      - name: Confirm freeze LSN reached DR
        run: node scripts/refresh-dr-replication-snapshot.mjs --wait-seconds 300 | tee dr-artifacts/freeze-lsn.json

      - name: Disable one-way subscription before DR promotion
        id: disable_subscription
        env:
          DR_CHANGE_CONFIRMATION: DISABLE_DR_SUBSCRIPTION
        run: node scripts/control-dr-subscription.mjs --disable

      - name: Capture pre-promotion DR write fingerprint
        id: dr_fingerprint_before
        run: node scripts/capture-dr-business-fingerprint.mjs | tee dr-artifacts/dr-fingerprint-before.json

      - name: Promote DR database writer
        id: promote_dr_db
        env:
          DR_CHANGE_CONFIRMATION: PROMOTE_DR
        run: |
          reason="Production DR RTO RPO measurement [drill:${DR_DRILL_ID}]"
          node scripts/switch-active-backend.mjs \
            --target DR \
            --apply \
            --reason "$reason"

      - name: Promote DR application and measure RTO
        id: promote_dr_app
        continue-on-error: true
        run: |
          set -euo pipefail
          vercel promote "$DR_EPOCH_2_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          EXPECTED_BACKEND=DR EXPECTED_PROMOTION_EPOCH=2 \
            node scripts/wait-for-active-backend.mjs \
            | tee dr-artifacts/dr-ready.json
          dr_ready_ms="$(node -e "const r=require('./dr-artifacts/dr-ready.json');process.stdout.write(String(r.readyAtMs))")"
          rto_ms="$((dr_ready_ms - PRIMARY_FREEZE_MS))"
          test "$rto_ms" -ge 0
          {
            echo "DR_READY_MS=$dr_ready_ms"
            echo "DR_RTO_MS=$rto_ms"
          } >> "$GITHUB_ENV"

      - name: Validate DR runtime
        continue-on-error: true
        env:
          DR_CHANGE_CONFIRMATION: VALIDATE_DR_ACTIVE
        run: |
          node scripts/validate-active-backend.mjs \
            --target DR \
            --expected-epoch 2 \
            --base-url "$APP_BASE_URL" \
            --apply

      - name: Run read-only DR smoke
        id: dr_smoke
        continue-on-error: true
        env:
          EXPECTED_BACKEND: DR
          EXPECTED_PROMOTION_EPOCH: "2"
          SKIP_OAUTH_WRITE: "true"
        run: node scripts/run-dr-readonly-smoke.mjs | tee dr-artifacts/dr-smoke.json

      - name: Prove no business writes occurred on DR
        id: fingerprint
        if: always() && steps.promote_dr_db.outcome == 'success' && steps.dr_fingerprint_before.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/capture-dr-business-fingerprint.mjs \
            | tee dr-artifacts/dr-fingerprint-after.json
          before="$(node -e "const r=require('./dr-artifacts/dr-fingerprint-before.json');process.stdout.write(r.digest)")"
          after="$(node -e "const r=require('./dr-artifacts/dr-fingerprint-after.json');process.stdout.write(r.digest)")"
          test "$before" = "$after" || {
            echo "::error::DR business-write fingerprint changed; automatic failback is blocked."
            exit 1
          }

      - name: Prepare Primary failback
        id: prepare_failback
        if: always() && steps.promote_dr_db.outcome == 'success' && steps.fingerprint.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: PREPARE_PRIMARY_FAILBACK
        run: |
          reason="Production DR RTO RPO measurement [drill:${DR_DRILL_ID}]"
          node scripts/prepare-primary-failback.mjs \
            --target PRIMARY \
            --apply \
            --reason "$reason"
          node scripts/read-backend-runtime-state.mjs --target DR \
            | tee dr-artifacts/dr-freeze.json
          dr_freeze_ms="$(node -e "const r=require('./dr-artifacts/dr-freeze.json');process.stdout.write(String(r.updatedAtMs))")"
          echo "DR_FREEZE_MS=$dr_freeze_ms" >> "$GITHUB_ENV"

      - name: Copy DR drill audit events to Primary
        if: always() && steps.prepare_failback.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: COPY_DRILL_EVENTS_TO_PRIMARY
        run: node scripts/reconcile-readonly-drill-events.mjs --copy

      - name: Promote Primary database writer
        id: promote_primary_db
        if: always() && steps.prepare_failback.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: PROMOTE_PRIMARY
        run: |
          reason="Production DR RTO RPO measurement [drill:${DR_DRILL_ID}]"
          node scripts/switch-active-backend.mjs \
            --target PRIMARY \
            --apply \
            --reason "$reason"

      - name: Remove DR-local event copies before replay
        if: always() && steps.promote_primary_db.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: DELETE_DR_LOCAL_EVENT_COPIES
        run: node scripts/reconcile-readonly-drill-events.mjs --delete-dr-local

      - name: Promote Primary failback deployment
        id: promote_primary_app
        if: always() && steps.promote_primary_db.outcome == 'success'
        run: |
          set -euo pipefail
          vercel promote "$PRIMARY_EPOCH_3_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          EXPECTED_BACKEND=PRIMARY EXPECTED_PROMOTION_EPOCH=3 \
            node scripts/wait-for-active-backend.mjs \
            | tee dr-artifacts/primary-ready.json
          primary_ready_ms="$(node -e "const r=require('./dr-artifacts/primary-ready.json');process.stdout.write(String(r.readyAtMs))")"
          failback_ms="$((primary_ready_ms - DR_FREEZE_MS))"
          test "$failback_ms" -ge 0
          {
            echo "PRIMARY_READY_MS=$primary_ready_ms"
            echo "PRIMARY_FAILBACK_MS=$failback_ms"
          } >> "$GITHUB_ENV"

      - name: Re-enable replication from Primary
        if: always() && steps.promote_primary_app.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: ENABLE_DR_SUBSCRIPTION
        run: node scripts/control-dr-subscription.mjs --enable

      - name: Close failover gate and verify replication
        if: always() && steps.promote_primary_app.outcome == 'success'
        run: |
          DR_CHANGE_CONFIRMATION=DISABLE_DR_FAILOVER_FLAG \
            node scripts/set-dr-failover-flag.mjs --disable
          node scripts/refresh-dr-replication-snapshot.mjs --wait-seconds 300 \
            | tee dr-artifacts/final-replication.json

      - name: Validate restored Primary
        id: primary_smoke
        if: always() && steps.promote_primary_app.outcome == 'success'
        env:
          DR_CHANGE_CONFIRMATION: VALIDATE_PRIMARY_ACTIVE
          EXPECTED_BACKEND: PRIMARY
          EXPECTED_PROMOTION_EPOCH: "3"
          SKIP_OAUTH_WRITE: "true"
        run: |
          node scripts/validate-active-backend.mjs \
            --target PRIMARY \
            --expected-epoch 3 \
            --base-url "$APP_BASE_URL" \
            --apply
          node scripts/run-dr-readonly-smoke.mjs \
            | tee dr-artifacts/primary-smoke.json

      - name: Persist failback-safe Production environment
        if: always() && steps.primary_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set_sensitive() {
            printf '%s' "$2" \
              | vercel env add "$1" production --sensitive --force --yes --token "$VERCEL_TOKEN" >/dev/null
          }
          set_plain() {
            printf '%s' "$2" \
              | vercel env add "$1" production --no-sensitive --force --yes --token "$VERCEL_TOKEN" >/dev/null
          }
          set_sensitive DR_DATABASE_URL "$DR_RUNTIME_DATABASE_URL"
          set_sensitive DR_DIRECT_URL "$DR_DIRECT_URL"
          set_sensitive DR_SUPABASE_SECRET_KEY "$DR_SUPABASE_SECRET_KEY"
          set_sensitive PRIMARY_SUPABASE_SECRET_KEY "$PRIMARY_SUPABASE_SECRET_KEY"
          set_plain DR_SUPABASE_URL "$DR_SUPABASE_URL"
          set_plain PRIMARY_SUPABASE_URL "$PRIMARY_SUPABASE_URL"
          set_plain DR_REPLICATION_SUBSCRIPTION_NAME "stallorder_primary_to_dr"
          set_plain BACKEND_ACTIVE_TARGET "PRIMARY"
          set_plain AUTH_PROJECT_CODE "PRIMARY"
          set_plain PROMOTION_EPOCH "3"

      - name: Write measured DR result
        if: always() && steps.promote_primary_app.outcome == 'success' && steps.promote_dr_app.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          canary_lag="$(node -e "const r=require('./dr-artifacts/pre-cutover-rpo.json');process.stdout.write(String(r.canaryLagSeconds))")"
          rto_seconds="$(node -e "process.stdout.write((${DR_RTO_MS}/1000).toFixed(3))")"
          failback_seconds="$(node -e "process.stdout.write((${PRIMARY_FAILBACK_MS}/1000).toFixed(3))")"
          cat > dr-artifacts/production-dr-result.json <<JSON
          {
            "runId": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "drillId": "${DR_DRILL_ID}",
            "primaryRegion": "ap-northeast-1",
            "drRegion": "ap-northeast-1",
            "vercelFunctionRegion": "hnd1",
            "rtoMs": ${DR_RTO_MS},
            "rtoSeconds": ${rto_seconds},
            "rpoSeconds": 0,
            "canaryReplicationSeconds": ${canary_lag},
            "failbackMs": ${PRIMARY_FAILBACK_MS},
            "failbackSeconds": ${failback_seconds},
            "drReadOnlySmokePassed": ${{ steps.dr_smoke.outcome == 'success' }},
            "primaryRestored": true,
            "replicationReenabled": true
          }
          JSON
          cat > dr-artifacts/production-dr-result.md <<MARKDOWN
          # Production DR Measurement

          - Commit: \`${GITHUB_SHA}\`
          - Vercel region: \`hnd1\`
          - Primary: Supabase Tokyo \`ap-northeast-1\`
          - DR: Supabase Tokyo \`ap-northeast-1\`
          - Measured RTO: **${rto_seconds} seconds**
          - Proven RPO at the freeze LSN: **0 seconds / 0 replicated rows lost**
          - Canary replication latency before cutover: **${canary_lag} seconds**
          - Measured failback: **${failback_seconds} seconds**
          - Primary restored: **yes**
          - Logical replication re-enabled: **yes**

          This same-region DR drill proves project-level failover. It does not
          prove survivability of a full Tokyo regional outage.
          MARKDOWN

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dr-measurement-${{ github.run_id }}
          path: dr-artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Close pre-cutover failover gate
        if: always() && steps.prepare.outcome != 'success'
        env:
          DR_CHANGE_CONFIRMATION: DISABLE_DR_FAILOVER_FLAG
        run: node scripts/set-dr-failover-flag.mjs --disable

      - name: Roll back a freeze before DR promotion completed
        if: always() && steps.prepare.outcome == 'success' && steps.promote_dr_db.outcome != 'success'
        env:
          DR_CHANGE_CONFIRMATION: ROLLBACK_PRIMARY_WRITE_FREEZE
        run: |
          set -euo pipefail
          reason="Rollback failed Production DR promotion [drill:${DR_DRILL_ID}]"
          node scripts/prepare-dr-failover.mjs \
            --target DR \
            --rollback \
            --reason "$reason"
          DR_CHANGE_CONFIRMATION=ENABLE_DR_SUBSCRIPTION \
            node scripts/control-dr-subscription.mjs --enable
          DR_CHANGE_CONFIRMATION=DISABLE_DR_FAILOVER_FLAG \
            node scripts/set-dr-failover-flag.mjs --disable
          vercel promote "$PRIMARY_EPOCH_1_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          EXPECTED_BACKEND=PRIMARY EXPECTED_PROMOTION_EPOCH=1 \
            node scripts/wait-for-active-backend.mjs

      - name: Enforce completed failback
        if: always() && steps.prepare.outcome == 'success'
        run: |
          test "${{ steps.promote_primary_app.outcome }}" = "success" || {
            echo "::error::Primary failback did not complete; keep the current writer fenced and follow the runbook."
            exit 1
          }
          test "${{ steps.primary_smoke.outcome }}" = "success" || {
            echo "::error::Primary failback smoke did not pass."
            exit 1
          }
          test "${{ steps.dr_smoke.outcome }}" = "success" || {
            echo "::error::DR read-only smoke failed, although Primary was restored."
            exit 1
          }
          test "${{ steps.promote_dr_app.outcome }}" = "success" || {
            echo "::error::DR RTO could not be measured, although Primary was restored."
            exit 1
          }

  storage-canary:
    needs: approval
    if: "${{ inputs.operation == 'storage-canary' && needs.approval.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DR_SUPABASE_DB_PASSWORD: ${{ secrets.DR_SUPABASE_DB_PASSWORD }}
      PRIMARY_REPLICATION_PASSWORD: ${{ secrets.PRIMARY_REPLICATION_PASSWORD }}
      PRODUCTION_ENVIRONMENT_APPROVED: "true"
    steps:
      - name: Validate protected invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production DR operations must run from main."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "PROVE_STORAGE_DR" || {
            echo "::error::Confirmation must be PROVE_STORAGE_DR."
            exit 1
          }
          for name in \
            SUPABASE_ACCESS_TOKEN \
            DR_SUPABASE_DB_PASSWORD \
            PRIMARY_REPLICATION_PASSWORD \
            PRIMARY_SUPABASE_PROJECT_REF \
            DR_SUPABASE_PROJECT_REF
          do
            test -n "${!name:-}" || {
              echo "::error::Missing protected configuration: ${name}"
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the verified Staging tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')" || {
            echo "::error::main does not match the verified staging tree."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build protected database URLs
        run: node scripts/export-dr-database-urls.mjs

      - name: Export protected Storage runtime
        run: node scripts/export-dr-runtime-environment.mjs

      - name: Review Storage canary dry-run
        run: node scripts/run-storage-replication-canary.mjs

      - name: Prove Storage byte replication and cleanup
        env:
          DR_CHANGE_CONFIRMATION: PROVE_STORAGE_DR
        run: |
          mkdir -p dr-artifacts
          node scripts/run-storage-replication-canary.mjs --apply \
            | tee dr-artifacts/storage-replication-canary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-storage-dr-canary-${{ github.run_id }}
          path: dr-artifacts/storage-replication-canary.json
          if-no-files-found: error
          retention-days: 30
