name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Remote environment to validate without applying migrations
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run production:check
      - run: npm run oauth:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run db:test
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - if: always()
        run: npx supabase stop --no-backup

  verify-remote:
    needs: verify-local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Require main for Production
        if: inputs.environment == 'production'
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Validate protected environment configuration
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
      - name: Link selected Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Compare migration history
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Detect pending or divergent migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Lint remote database
        run: supabase db lint --linked --level warning --fail-on warning
