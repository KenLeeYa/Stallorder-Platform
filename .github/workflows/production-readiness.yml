name: Production Readiness

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Remote Production environment to validate or migrate
        required: true
        type: choice
        options:
          - production
      apply_migrations:
        description: Apply pending migrations after the dry-run succeeds
        required: true
        type: boolean
        default: false
      include_all_migrations:
        description: Allow reviewed local migrations older than the remote head
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: read

concurrency:
  group: environment-readiness-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run production:check
      - run: npm run lint
      - run: npm run ui:audit
      - run: npm run typecheck
      - run: npm test
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run db:test
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - if: always()
        run: npx supabase stop --no-backup

  verify-remote:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    needs: verify-local
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      TARGET_ENVIRONMENT: production
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Require verified Staging tree for Production
        if: env.TARGET_ENVIRONMENT == 'production'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production updates must run from main."
            exit 1
          }
          git fetch --no-tags origin staging
          main_tree="$(git rev-parse 'HEAD^{tree}')"
          staging_tree="$(git rev-parse 'origin/staging^{tree}')"
          test "$main_tree" = "$staging_tree" || {
            echo "::error::Production tree does not match the verified staging tree. Merge and verify staging before production."
            exit 1
          }
      - name: Validate protected environment configuration
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "${APP_BASE_URL:-}" || { echo "::error::Missing APP_BASE_URL"; exit 1; }
      - name: Link selected Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Compare migration history
        run: supabase migration list --linked
      - name: Detect pending or divergent migrations
        if: ${{ !inputs.include_all_migrations }}
        run: supabase db push --linked --dry-run
      - name: Detect reviewed out-of-order migrations
        if: inputs.include_all_migrations
        run: supabase db push --linked --dry-run --include-all
      - name: Apply pending migrations
        if: (github.event_name == 'push' || inputs.apply_migrations) && !inputs.include_all_migrations
        run: supabase db push --linked
      - name: Apply reviewed out-of-order migrations
        if: inputs.apply_migrations && inputs.include_all_migrations
        run: supabase db push --linked --include-all
      - name: Verify applied migration history
        if: github.event_name == 'push' || inputs.apply_migrations
        run: supabase migration list --linked
      - name: Lint remote database
        run: supabase db lint --linked --level warning --fail-on warning
      - name: Wait for matching Vercel deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            state="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
                --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "pending"'
            )"
            case "$state" in
              success)
                exit 0
                ;;
              error|failure)
                echo "::error::Vercel deployment failed for ${GITHUB_SHA}."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the matching Vercel deployment."
          exit 1
      - name: Smoke deployed application
        if: github.event_name == 'push'
        env:
          PRODUCTION_BASE_URL: ${{ vars.APP_BASE_URL }}
          SMOKE_SKIP_DOMAIN_REDIRECTS: ${{ env.TARGET_ENVIRONMENT == 'staging' && 'true' || 'false' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run production:smoke
