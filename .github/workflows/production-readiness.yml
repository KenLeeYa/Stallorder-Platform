name: Production Readiness

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Remote Production environment to validate or migrate
        required: true
        type: choice
        options:
          - production
      apply_migrations:
        description: Apply pending migrations after the dry-run succeeds
        required: true
        type: boolean
        default: false
      include_all_migrations:
        description: Allow reviewed local migrations older than the remote head
        required: true
        type: boolean
        default: false
      plan_run_id:
        description: Successful Production plan run ID required when applying
        required: false
        type: string
        default: ""
      dr_schema_run_id:
        description: Successful DR schema Apply run required before a manual Production Plan or Apply
        required: false
        type: string
        default: ""
      confirmation:
        description: Type APPLY_PRODUCTION_RELEASE when applying
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: environment-readiness-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run production:check
      - run: npm run lint
      - run: npm run ui:audit
      - run: npm run typecheck
      - run: npm test
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run db:test
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - if: always()
        run: npx supabase stop --no-backup

  verify-remote:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    needs: verify-local
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      TARGET_ENVIRONMENT: production
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Require verified Staging tree for Production
        if: env.TARGET_ENVIRONMENT == 'production'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production updates must run from main."
            exit 1
          }
          git fetch --no-tags origin staging
          main_tree="$(git rev-parse 'HEAD^{tree}')"
          staging_tree="$(git rev-parse 'origin/staging^{tree}')"
          test "$main_tree" = "$staging_tree" || {
            echo "::error::Production tree does not match the verified staging tree. Merge and verify staging before production."
            exit 1
          }
      - name: Validate manual Production apply invocation
        if: inputs.apply_migrations
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          INPUT_DR_SCHEMA_RUN_ID: ${{ inputs.dr_schema_run_id }}
          INPUT_INCLUDE_ALL_MIGRATIONS: ${{ inputs.include_all_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
            echo "::error::Only the repository owner may confirm Production apply."
            exit 1
          }
          test "$INPUT_CONFIRMATION" = "APPLY_PRODUCTION_RELEASE" || {
            echo "::error::Confirmation must be APPLY_PRODUCTION_RELEASE."
            exit 1
          }
          [[ "$INPUT_PLAN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::Apply requires the successful Production Plan run ID."
            exit 1
          }
          [[ "$INPUT_DR_SCHEMA_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::Production Apply requires the successful DR schema Apply run ID."
            exit 1
          }
          test "$INPUT_INCLUDE_ALL_MIGRATIONS" = "false" || {
            echo "::error::DR-first Production Apply does not allow out-of-order migrations."
            exit 1
          }
      - name: Validate protected environment configuration
        run: |
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "${APP_BASE_URL:-}" || { echo "::error::Missing APP_BASE_URL"; exit 1; }
      - name: Validate DR schema predecessor for a manual Production Plan
        if: github.event_name == 'workflow_dispatch' && !inputs.apply_migrations
        env:
          INPUT_DR_SCHEMA_RUN_ID: ${{ inputs.dr_schema_run_id }}
          INPUT_INCLUDE_ALL_MIGRATIONS: ${{ inputs.include_all_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
            echo "::error::Only the repository owner may create a Production Plan."
            exit 1
          }
          [[ "$INPUT_DR_SCHEMA_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::Manual Production Plan requires the successful DR schema Apply run ID."
            exit 1
          }
          test "$INPUT_INCLUDE_ALL_MIGRATIONS" = "false" || {
            echo "::error::DR-first Production Plan does not allow out-of-order migrations."
            exit 1
          }
      - name: Download approved Production plan
        if: inputs.apply_migrations
        uses: actions/download-artifact@v4
        with:
          name: production-release-plan-${{ inputs.plan_run_id }}
          path: approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify manual approval is bound to the immutable plan
        if: inputs.apply_migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVAL_OPERATION: production-migrations
          PRODUCTION_APPROVAL_PARAMETERS_JSON: '{"drSchemaRunId":"${{ inputs.dr_schema_run_id }}","includeAllMigrations":false}'
          PRODUCTION_APPROVAL_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PRODUCTION_APPROVAL_RECEIPT_PATH: approved-plan/production-approval.json
        run: node scripts/production-approval.mjs verify
      - name: Download successful DR schema Apply evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: production-dr-schema-apply-${{ inputs.dr_schema_run_id }}
          path: predecessor-dr-schema
          github-token: ${{ github.token }}
          run-id: ${{ inputs.dr_schema_run_id }}
      - name: Verify DR schema completed before the Production Plan or Apply
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVAL_OPERATION: production-dr-schema
          PRODUCTION_EVIDENCE_PATH: predecessor-dr-schema/production-dr-schema-evidence.json
          PRODUCTION_EVIDENCE_RUN_ID: ${{ inputs.dr_schema_run_id }}
        run: node scripts/production-approval.mjs verify-evidence
      - name: Export temporary database access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/export-dr-database-urls.mjs --primary-only
      - name: Compare migration history
        run: supabase migration list --db-url "$SUPABASE_CI_DATABASE_URL"
      - name: Audit global stall codes before planning or applying schema
        run: |
          supabase db query --db-url "$SUPABASE_CI_DATABASE_URL" \
            --file scripts/sql/assert-global-stall-code-uniqueness.sql \
            --log-level error
      - name: Detect pending or divergent migrations
        if: ${{ !inputs.include_all_migrations }}
        run: supabase db push --db-url "$SUPABASE_CI_DATABASE_URL" --dry-run
      - name: Detect reviewed out-of-order migrations
        if: inputs.include_all_migrations
        run: supabase db push --db-url "$SUPABASE_CI_DATABASE_URL" --dry-run --include-all
      - name: Lint remote database before apply
        run: supabase db lint --db-url "$SUPABASE_CI_DATABASE_URL" --level warning --fail-on warning
      - name: Create immutable Production plan receipt
        if: github.event_name == 'push' || !inputs.apply_migrations
        env:
          PRODUCTION_APPROVAL_OPERATION: production-migrations
          PRODUCTION_APPROVAL_PARAMETERS_JSON: '{"drSchemaRunId":"${{ inputs.dr_schema_run_id }}","includeAllMigrations":false}'
          PRODUCTION_APPROVAL_RECEIPT_PATH: artifacts/production-approval.json
        run: node scripts/production-approval.mjs create
      - name: Upload Production release plan
        if: github.event_name == 'push' || !inputs.apply_migrations
        uses: actions/upload-artifact@v4
        with:
          name: production-release-plan-${{ github.run_id }}
          path: artifacts/production-approval.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate protected Production configuration
        if: inputs.apply_migrations
        env:
          PRODUCTION_TEST_QR_URL: ${{ secrets.PRODUCTION_TEST_QR_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PRODUCTION_TEST_QR_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "${!name:-}" || {
              echo "::error::Missing protected configuration: ${name}"
              exit 1
            }
          done
          node --input-type=module -e '
            import { resolveProductionTestQrUrl } from "./scripts/lib/production-smoke-qr-url.mjs";
            resolveProductionTestQrUrl({
              baseUrl: process.env.APP_BASE_URL,
              configuredUrl: process.env.PRODUCTION_TEST_QR_URL,
              required: true,
            });
          '
      - name: Normalize protected Vercel token
        if: inputs.apply_migrations
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/export-normalized-vercel-token.mjs
      - name: Install pinned Vercel CLI
        if: inputs.apply_migrations
        run: npm install --global vercel@56.3.1
      - name: Build approved Production deployment without assigning domains
        if: inputs.apply_migrations
        env:
          APPROVAL_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(
            vercel deploy . \
              --prod \
              --skip-domain \
              --force \
              --yes \
              --token "$VERCEL_TOKEN" \
              --meta "approval_plan_run_id=$APPROVAL_PLAN_RUN_ID" \
              --meta "git_commit=${GITHUB_SHA}"
          )"
          [[ "$deployment" == https://*.vercel.app ]] || {
            echo "::error::Vercel deployment URL was not returned."
            exit 1
          }
          echo "APPROVED_PRODUCTION_DEPLOYMENT=$deployment" >> "$GITHUB_ENV"
      - name: Apply pending migrations
        if: inputs.apply_migrations && !inputs.include_all_migrations
        run: supabase db push --db-url "$SUPABASE_CI_DATABASE_URL"
      - name: Apply reviewed out-of-order migrations
        if: inputs.apply_migrations && inputs.include_all_migrations
        run: supabase db push --db-url "$SUPABASE_CI_DATABASE_URL" --include-all
      - name: Verify applied migration history
        if: inputs.apply_migrations
        run: supabase migration list --db-url "$SUPABASE_CI_DATABASE_URL"
      - name: Lint remote database after apply
        if: inputs.apply_migrations
        run: supabase db lint --db-url "$SUPABASE_CI_DATABASE_URL" --level warning --fail-on warning
      - name: Re-audit global stall codes after apply
        if: inputs.apply_migrations
        run: |
          supabase db query --db-url "$SUPABASE_CI_DATABASE_URL" \
            --file scripts/sql/assert-global-stall-code-uniqueness.sql \
            --log-level error
      - name: Deploy Production Edge Functions
        if: inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for function_directory in supabase/functions/*; do
            test -f "$function_directory/index.ts" || continue
            function_name="$(basename "$function_directory")"
            deployed=false
            for attempt in 1 2 3; do
              deploy_log="$(mktemp)"
              if supabase functions deploy "$function_name" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --use-api \
                --import-map supabase/functions/deno.json \
                >"$deploy_log" 2>&1; then
                deployed=true
                rm -f "$deploy_log"
                break
              fi
              if grep -Eqi \
                'unexpected deploy status (429|500|502|503|504)|"retryable"[[:space:]]*:[[:space:]]*true' \
                "$deploy_log" \
                && [ "$attempt" -lt 3 ]; then
                delay_seconds="$((attempt * 60))"
                echo "::warning::Transient Supabase deployment failure for ${function_name}; retrying in ${delay_seconds}s."
                rm -f "$deploy_log"
                sleep "$delay_seconds"
                continue
              fi
              status_code="$(grep -Eio 'unexpected deploy status [0-9]{3}' "$deploy_log" | tail -n 1 || true)"
              rm -f "$deploy_log"
              echo "::error::Edge Function deployment failed for ${function_name}${status_code:+ (${status_code})}."
              exit 1
            done
            test "$deployed" = "true" || {
              echo "::error::Edge Function deployment retry limit reached for ${function_name}."
              exit 1
            }
          done
      - name: Verify deployed Production Edge Functions
        if: inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployed_functions="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json)"
          for function_directory in supabase/functions/*; do
            test -f "$function_directory/index.ts" || continue
            function_name="$(basename "$function_directory")"
            jq -e --arg function_name "$function_name" \
              'any(.[]; (.slug // .name) == $function_name and .status == "ACTIVE")' \
              <<<"$deployed_functions" >/dev/null || {
              echo "::error::Edge Function is missing or not ACTIVE after deployment: ${function_name}."
              exit 1
            }
          done
      - name: Promote approved deployment and smoke Production
        if: inputs.apply_migrations
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.APP_BASE_URL }}
          PRODUCTION_TEST_QR_REQUIRED: "true"
          PRODUCTION_TEST_QR_URL: ${{ secrets.PRODUCTION_TEST_QR_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          promoted=false
          rollback_on_error() {
            if [ "$promoted" = "true" ]; then
              echo "::warning::Production smoke failed; rolling back the Vercel alias."
              vercel rollback --yes --token "$VERCEL_TOKEN"
            fi
          }
          trap rollback_on_error ERR
          vercel promote "$APPROVED_PRODUCTION_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          promoted=true
          npm run production:smoke
          trap - ERR
      - name: Create immutable successful Production migration evidence
        if: inputs.apply_migrations
        env:
          PRODUCTION_APPROVAL_OPERATION: production-migrations
          PRODUCTION_EVIDENCE_PATH: artifacts/production-primary-migration-evidence.json
        run: node scripts/production-approval.mjs create-evidence
      - name: Upload successful Production migration evidence
        if: inputs.apply_migrations
        uses: actions/upload-artifact@v4
        with:
          name: production-primary-migration-${{ github.run_id }}
          path: artifacts/production-primary-migration-evidence.json
          if-no-files-found: error
          retention-days: 30
