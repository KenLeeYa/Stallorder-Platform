name: Web Install Scope Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_web_artifact_fixture
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Use the reviewed npm workspace selector version
        run: npm install --global npm@11.16.0
      - name: Install only Web root and shared contracts with development dependencies
        run: npm ci --workspace packages/contracts --include-workspace-root --include=dev
      - name: Verify installed scope, audit, inventory and fresh Web artifact
        run: node scripts/verify-web-release-scope.mjs web-scope-evidence
      - name: Preserve scope evidence without claiming deployment verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-install-scope-${{ github.run_id }}
          path: web-scope-evidence/
          if-no-files-found: warn
