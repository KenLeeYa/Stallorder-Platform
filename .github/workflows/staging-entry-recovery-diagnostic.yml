name: Bounded pre-data Staging entry recovery
on:
  push:
    branches: [codex/staging-auth-isolation-recovery-20261022]
    paths: [.github/workflows/staging-entry-recovery-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-dr-operations
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-plan-39724497044
          path: approved-transition-plan
          github-token: ${{ github.token }}
          run-id: 39724497044
      - uses: actions/download-artifact@v4
        with:
          name: dr-retirement-encrypted-39647447270
          path: approved-backup
          github-token: ${{ github.token }}
          run-id: 39647447270
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-conversion-39724729839
          path: failed-apply
          github-token: ${{ github.token }}
          run-id: 39724729839
      - name: Recover only failed-run entry resources; verify full prestate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          BACKUP_RUN_ID: '39647447270'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {openBackup} from './scripts/backup-dr-for-staging.mjs';
          import {STAGING_TARGET,RETIRED_HOSTS,conversionApi,conversionDigest,readConversionBackup,readConversionPrimary,verifyOriginalReplica,readStagingProviderPrestate,stagingOwnerPolicy} from './scripts/dr-staging-conversion-plan.mjs';
          const plan=JSON.parse(await readFile('approved-transition-plan/dr-staging-transition-plan.json','utf8'));
          assert.equal(conversionDigest(plan),'4029cd89e30e878a59fb639e7333220dfe629b1af407bd8f4f536831e913c668');
          assert.equal(plan.sourceSha,'e03e41a65485e80d74389139c94ae0c112cc33f3');
          const state=JSON.parse(openBackup(await readFile('failed-apply/staging-access-recovery.json.enc'),process.env.DR_BACKUP_ENCRYPTION_KEY));
          assert.equal(state.planDigest,conversionDigest(plan));
          assert.equal(state.sourceSha,plan.sourceSha);
          assert.equal(state.appId,'2d452dca-540f-4c69-bf35-e1e3ff4b6bf5');
          assert.equal(state.dnsId,'e80ebb730657874334c571fb456dd25a');
          const backup=await readConversionBackup();
          assert.deepEqual(backup.identity,plan.backup);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          const primary=async()=>assert.deepEqual(await readConversionPrimary(),plan.primary);
          await primary();
          const auth=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/config/auth`);
          const edge=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/secrets`);
          assert.equal(conversionDigest(auth),plan.providerPrestate.authDigest);
          assert.equal(conversionDigest(edge),plan.providerPrestate.edgeSecretsDigest);
          const domains=await conversionApi('vercel',`/v9/projects/${STAGING_TARGET.project}/domains?limit=100`);
          assert.deepEqual(domains.domains.map(d=>d.name).sort(),[...RETIRED_HOSTS].sort());
          assert.ok(!domains.pagination?.next);
          for(const domain of domains.domains) assert.ok(domain.projectId===STAGING_TARGET.project&&domain.verified&&domain.redirect===null&&domain.gitBranch===null&&domain.customEnvironmentId===null);
          for(const expected of plan.providerPrestate.retiredAliases) {
            const alias=await conversionApi('vercel',`/v4/aliases/${expected.host}`);
            assert.ok(alias.uid===expected.aliasId&&alias.deploymentId===expected.deploymentId&&alias.projectId===STAGING_TARGET.project);
            const origin=await fetch(`https://${expected.deploymentUrl}/login`,{redirect:'manual'});
            assert.ok(origin.status===401||(origin.status===302&&origin.headers.get('location')?.startsWith('https://vercel.com/sso-api?')));
          }
          const prefix=`/accounts/${STAGING_TARGET.account}/access`;
          const app=await conversionApi('cloudflare',`${prefix}/apps/${state.appId}`);
          const policies=await conversionApi('cloudflare',`${prefix}/apps/${state.appId}/policies`);
          assert.ok(app.id===state.appId&&app.domain===STAGING_TARGET.host&&app.aud===state.audience);
          assert.equal(policies.length,1);
          assert.equal(conversionDigest(stagingOwnerPolicy(policies[0])),plan.providerPrestate.sourcePolicyDigest);
          const tokens=await conversionApi('cloudflare',`${prefix}/service_tokens?per_page=1000`);
          assert.ok(tokens.length<1000&&!tokens.some(t=>t.id===state.qaTokenId));
          const dnsPath=`/zones/${STAGING_TARGET.zone}/dns_records/${state.dnsId}`;
          const dns=await conversionApi('cloudflare',dnsPath);
          assert.ok(dns.id===state.dnsId&&dns.name===STAGING_TARGET.host&&dns.type==='CNAME'&&dns.content==='cname.vercel-dns.com'&&dns.proxied&&dns.comment===`Staging conversion ${plan.sourceSha}`);
          // Separate bounded recovery authority: never the old DR or Primary DNS.
          assert.equal(dnsPath,'/zones/8f8070a80ad4182e4af0c11a1b496968/dns_records/e80ebb730657874334c571fb456dd25a');
          const removed=await fetch(`https://api.cloudflare.com/client/v4${dnsPath}`,{method:'DELETE',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.ok(removed.ok,'BOUNDED_NEW_DNS_RECOVERY_FAILED');
          const deletion=await removed.json();
          assert.ok(deletion.success&&deletion.result?.id===state.dnsId);
          await primary();
          await conversionApi('cloudflare',`${prefix}/apps/${state.appId}`,{method:'DELETE'});
          await primary();
          const restored=await readStagingProviderPrestate();
          const {targetDomainDigest:oldDomainDigest,...oldStable}=plan.providerPrestate;
          const {targetDomainDigest:newDomainDigest,...newStable}=restored;
          assert.deepEqual(newStable,oldStable);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          const receipt={failedPlan:39724497044,failedApply:39724729839,recoverySource:process.env.GITHUB_SHA,backup:plan.backup,
            fullOriginalDataUnchanged:true,primaryUnchanged:true,authUnchanged:true,edgeUnchanged:true,
            retiredAliasIdentityRestored:true,oldDomainDigest,newDomainDigest,
            domainCreationMetadataChanged:true,freshPlanRequired:true,removedNewAccess:state.appId,removedNewDns:state.dnsId,primaryWrites:false};
          await mkdir('artifacts',{recursive:true});
          await writeFile('artifacts/staging-predata-recovery.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: staging-predata-recovery-${{ github.run_id }}
          path: artifacts/staging-predata-recovery.json
          if-no-files-found: error
          retention-days: 30
