name: Bounded read-only Staging conversion diagnosis
on:
  push:
    branches: [codex/staging-alias-id-recovery-20261022]
    paths: [.github/workflows/dr-staging-readback-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-dr-operations
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dr-retirement-encrypted-39647447270
          path: approved-backup
          github-token: ${{ github.token }}
          run-id: 39647447270
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-plan-39707497864
          path: approved-transition-plan
          github-token: ${{ github.token }}
          run-id: 39707497864
      - name: Verify exact restored prestate without provider writes
        env:
          BACKUP_RUN_ID: "39647447270"
          GITHUB_TOKEN: ${{ github.token }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { readConversionBackup, readConversionPrimary, verifyOriginalReplica, readStagingProviderPrestate, conversionDigest, conversionApi, STAGING_TARGET as T } from './scripts/dr-staging-conversion-plan.mjs';
          const plan = JSON.parse(await readFile('approved-transition-plan/dr-staging-transition-plan.json','utf8'));
          assert.equal(conversionDigest(plan),'a4b6423ff586fe77cffbae627eebb07bb1e01c28a2f211962a8d319b0faf77cd');
          const backup = await readConversionBackup();
          assert.deepEqual(backup.identity, plan.backup);
          assert.equal(await verifyOriginalReplica(backup.manifest), '3be52e470b9fdfeb7bdba8e15733bd915cd78bef8cac8536bc6a160e61b1e91a');
          console.log('PASS: qualified backup and unchanged239table original replica');
          assert.deepEqual(await readConversionPrimary(),plan.primary);
          console.log('PASS: exact original Primary deployment, version, environment and DNS');
          assert.deepEqual(await readStagingProviderPrestate(),plan.providerPrestate);
          console.log('PASS: exact original provider prestate restored; Staging entry absent and old DR preserved');
          const tokens = await conversionApi('cloudflare', `/accounts/${T.account}/access/service_tokens?per_page=1000`);
          assert.ok(tokens.length < 1000 && !tokens.some(t => t.id === '67d8fc97-e5f4-4c39-bfb8-0dd1ab00819c'));
          console.log('PASS: temporary QA token removed; no mutation performed');
          NODE
