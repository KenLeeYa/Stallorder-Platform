name: Isolated database credential overlap qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stallorder-preview-pr389-writer
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify bounded scope and secret redaction
        run: node --test scripts/ci/delivery-credential-preview.test.mjs
      - name: Probe only the existing isolated Preview and remove the exact issued role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/delivery-credential-preview.mjs
