# Candidate only: install inert, then pin both provider workflow IDs in a separate protected change.
name: Independent paired Edge restore only

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        type: string
        required: true
      snapshot_job_id:
        type: string
        required: true
      original_archive_sha256:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: stallorder-preview-pr389-writer
  cancel-in-progress: false

jobs:
  restore-intent:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: Preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.109.1
      - name: Verify source and interruption recovery controls
        working-directory: control
        run: node --test scripts/ci/delivery-edge-recovery-entry.test.mjs scripts/ci/delivery-edge-recovery-transport.test.mjs scripts/ci/delivery-edge-recovery-plan.test.mjs scripts/ci/delivery-edge-recovery-history.test.mjs scripts/ci/delivery-edge-paired-load.test.mjs scripts/ci/delivery-edge-interruption-journal.test.mjs scripts/ci/delivery-edge-usage-recovery.test.mjs scripts/ci/delivery-edge-usage.test.mjs scripts/ci/delivery-edge-usage-references.test.mjs
      - name: Persist immutable independent recovery intent
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EDGE_RECOVERY_PHASE: restore-intent
          EDGE_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          EDGE_SNAPSHOT_JOB_ID: ${{ inputs.snapshot_job_id }}
          EDGE_ORIGINAL_ARCHIVE_SHA256: ${{ inputs.original_archive_sha256 }}
        run: node control/scripts/ci/delivery-edge-recovery-entry.mjs

  restore:
    needs: restore-intent
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: Preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.109.1
      - name: Verify source and interruption recovery controls
        working-directory: control
        run: node --test scripts/ci/delivery-edge-recovery-entry.test.mjs scripts/ci/delivery-edge-recovery-transport.test.mjs scripts/ci/delivery-edge-recovery-plan.test.mjs scripts/ci/delivery-edge-recovery-history.test.mjs scripts/ci/delivery-edge-paired-load.test.mjs scripts/ci/delivery-edge-interruption-journal.test.mjs scripts/ci/delivery-edge-usage-recovery.test.mjs scripts/ci/delivery-edge-usage.test.mjs scripts/ci/delivery-edge-usage-references.test.mjs
      - name: Restore exact interrupted Edge preimages once
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EDGE_RECOVERY_PHASE: restore
          EDGE_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          EDGE_SNAPSHOT_JOB_ID: ${{ inputs.snapshot_job_id }}
          EDGE_ORIGINAL_ARCHIVE_SHA256: ${{ inputs.original_archive_sha256 }}
        run: node control/scripts/ci/delivery-edge-recovery-entry.mjs

  verify:
    needs: restore
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.event.repository.private == false && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: Preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected control and identical verified staging tree
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main staging
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/staging^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.109.1
      - name: Verify source and interruption recovery controls
        working-directory: control
        run: node --test scripts/ci/delivery-edge-recovery-entry.test.mjs scripts/ci/delivery-edge-recovery-transport.test.mjs scripts/ci/delivery-edge-recovery-plan.test.mjs scripts/ci/delivery-edge-recovery-history.test.mjs scripts/ci/delivery-edge-paired-load.test.mjs scripts/ci/delivery-edge-interruption-journal.test.mjs scripts/ci/delivery-edge-usage-recovery.test.mjs scripts/ci/delivery-edge-usage.test.mjs scripts/ci/delivery-edge-usage-references.test.mjs
      - name: Reconstruct the exact product without executing it
        run: node control/scripts/ci/delivery-candidate.mjs materialize
      - name: Install exact product dependencies
        working-directory: product
        run: npm ci
      - name: Generate exact product Prisma client
        working-directory: product
        run: npx --no-install prisma generate
      - name: Verify independent restoration and reconcile owned fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EDGE_RECOVERY_PHASE: verify
          EDGE_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          EDGE_SNAPSHOT_JOB_ID: ${{ inputs.snapshot_job_id }}
          EDGE_ORIGINAL_ARCHIVE_SHA256: ${{ inputs.original_archive_sha256 }}
        run: node control/scripts/ci/delivery-edge-recovery-entry.mjs
