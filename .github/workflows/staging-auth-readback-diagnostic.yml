name: Bounded failed-Apply Auth and entry recovery
on:
  push:
    branches: [codex/staging-auth-readback-recovery-20261022]
    paths: [.github/workflows/staging-auth-readback-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-dr-operations
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-plan-39743118579
          path: approved-transition-plan
          github-token: ${{ github.token }}
          run-id: 39743118579
      - uses: actions/download-artifact@v4
        with:
          name: dr-retirement-encrypted-39647447270
          path: approved-backup
          github-token: ${{ github.token }}
          run-id: 39647447270
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-conversion-39752454954
          path: failed-apply
          github-token: ${{ github.token }}
          run-id: 39752454954
      - name: Restore exact archived Auth and old entry; remove only failed-run resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          BACKUP_RUN_ID: '39647447270'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {openBackup} from './scripts/backup-dr-for-staging.mjs';
          import {stagingAuthPatch} from './scripts/staging-data-conversion.mjs';
          import {conversionApi,conversionDigest,readConversionBackup,readConversionPrimary,verifyOriginalReplica,readStagingProviderPrestate,stagingOwnerPolicy,STAGING_TARGET,RETIRED_HOSTS} from './scripts/dr-staging-conversion-plan.mjs';
          import {normalizeProtectedSecret} from './scripts/lib/protected-secret.mjs';
          const plan=JSON.parse(await readFile('approved-transition-plan/dr-staging-transition-plan.json','utf8'));
          assert.equal(conversionDigest(plan),'a5d29bd42b17eb590483aa0a4f1442e3022f76c9102182c498e7c3e5d8e728ac');
          assert.equal(plan.sourceSha,'16a991fff672ae5f96736edfd97e0ac98b2d7c48');
          const progress=JSON.parse(await readFile('failed-apply/staging-conversion-progress.json','utf8'));
          assert.equal(progress.sourceSha,plan.sourceSha);
          assert.equal(progress.planDigest,conversionDigest(plan));
          assert.deepEqual(progress.completed,['immutable-plan','original-data-matches-qualified-backup','protected-entry-and-token-edit-permissions']);
          const recovery=JSON.parse(openBackup(await readFile('failed-apply/staging-provider-recovery.json.enc'),process.env.DR_BACKUP_ENCRYPTION_KEY));
          assert.equal(recovery.sourceSha,plan.sourceSha);
          assert.equal(recovery.ref,STAGING_TARGET.ref);
          assert.equal(conversionDigest(recovery.auth),plan.providerPrestate.authDigest);
          const backup=await readConversionBackup();
          assert.deepEqual(backup.identity,plan.backup);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          assert.deepEqual(await readConversionPrimary(),plan.primary);
          const auth=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/config/auth`);
          const edge=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/secrets`);
          assert.equal(conversionDigest(edge),plan.providerPrestate.edgeSecretsDigest);
          const expected={...Object.fromEntries(Object.entries(recovery.auth).filter(([name])=>/^hook_.+_(enabled|uri|secrets)$/.test(name))),...stagingAuthPatch(recovery.auth)};
          const mismatches=Object.entries(expected).filter(([name,value])=>name!=='smtp_pass'&&!(value==null||value===''?auth[name]==null||auth[name]==='':String(auth[name])===String(value))).map(([name,value])=>({name,expectedEmpty:value==null||value==='',actualEmpty:auth[name]==null||auth[name]==='',sameAsBefore:auth[name]===recovery.auth[name],beforeEmpty:recovery.auth[name]==null||recovery.auth[name]==='',actualType:typeof auth[name],actualLength:typeof auth[name]==='string'?auth[name].length:null}));
          const changedNames=Object.keys(auth).filter(name=>JSON.stringify(auth[name])!==JSON.stringify(recovery.auth[name]));
          const prefix=`/accounts/${STAGING_TARGET.account}/access`;
          const tokens=await conversionApi('cloudflare',`${prefix}/service_tokens?per_page=1000`);
          assert.ok(tokens.length<1000&&!tokens.some(t=>t.id==='28f5a903-1814-4dd4-880a-e86748024890'));
          const policies=await conversionApi('cloudflare',`${prefix}/apps/1dc12f47-08f7-425f-a6f0-0e24fde0eeea/policies`);
          assert.equal(policies.length,1);
          assert.ok(!policies.some(p=>p.id==='1d7a6873-c232-49cb-b4c8-a618fb21a66c'));
          const result={failedApply:39752454954,failedPlan:39743118579,source:process.env.GITHUB_SHA,ref:STAGING_TARGET.ref,originalDataUnchanged:true,primaryUnchanged:true,edgeUnchanged:true,temporaryQaTokenAbsent:true,temporaryQaPolicyAbsent:true,authDigest:conversionDigest(auth),changedNames,mismatches,primaryWrites:false,providerWrites:false};
          await mkdir('artifacts',{recursive:true});
          await writeFile('artifacts/staging-auth-readback-diagnostic.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          assert.equal(conversionDigest(auth),'4c8b1e99abfb73dfddb50b6352c6711dc0de7bcd80a4c166ec145d8d4f8ddac1');
          const state=JSON.parse(openBackup(await readFile('failed-apply/staging-access-recovery.json.enc'),process.env.DR_BACKUP_ENCRYPTION_KEY));
          assert.ok(state.planDigest===conversionDigest(plan)&&state.sourceSha===plan.sourceSha);
          assert.equal(state.appId,'1dc12f47-08f7-425f-a6f0-0e24fde0eeea');
          assert.equal(state.dnsId,'5e1c867daf713106aff87ac5d2260bb4');
          const primary=async()=>assert.deepEqual(await readConversionPrimary(),plan.primary);
          const completed=[];
          const checkpoint=async name=>{await primary();completed.push(name);await writeFile('artifacts/staging-recovery-progress.json',JSON.stringify({failedApply:39752454954,source:process.env.GITHUB_SHA,completed,primaryWrites:false}));};
          const project=await conversionApi('vercel',`/v9/projects/${STAGING_TARGET.project}`);
          assert.ok(project.id===STAGING_TARGET.project&&project.accountId===STAGING_TARGET.team&&project.ssoProtection?.deploymentType==='all_except_custom_domains'&&!project.link);
          const domains=await conversionApi('vercel',`/v9/projects/${STAGING_TARGET.project}/domains?limit=100`);
          assert.ok(!domains.pagination?.next&&domains.domains.length===1&&domains.domains[0].name===STAGING_TARGET.host&&domains.domains[0].gitBranch==='staging');
          assert.equal((await conversionApi('vercel',`/v9/projects/${STAGING_TARGET.project}/env`)).envs.length,0);
          assert.deepEqual(plan.providerPrestate.retiredAliases.map(item=>item.host),RETIRED_HOSTS);
          for(const old of plan.providerPrestate.retiredAliases){
            assert.equal(old.deploymentId,'dpl_5aZES3f8Hp7oKwjjRsnWybJpcT6a');
            const deployment=await conversionApi('vercel',`/v13/deployments/${old.deploymentId}`);
            assert.ok(deployment.projectId===STAGING_TARGET.project&&deployment.readyState==='READY'&&deployment.url===old.deploymentUrl);
            const aliases=await conversionApi('vercel',`/v2/deployments/${old.deploymentId}/aliases`);
            assert.ok(!aliases.aliases.some(alias=>RETIRED_HOSTS.includes(alias.alias)));
            const origin=await fetch(`https://${old.deploymentUrl}/login`,{redirect:'manual',signal:AbortSignal.timeout(20000)});
            assert.ok(origin.status===401||(origin.status===302&&origin.headers.get('location')?.startsWith('https://vercel.com/sso-api?')));
          }
          const newApp=await conversionApi('cloudflare',`${prefix}/apps/${state.appId}`);
          assert.ok(newApp.domain===STAGING_TARGET.host&&newApp.aud===state.audience);
          assert.equal(conversionDigest(stagingOwnerPolicy(policies[0])),plan.providerPrestate.sourcePolicyDigest);
          const oldPolicies=await conversionApi('cloudflare',`${prefix}/apps/${STAGING_TARGET.oldAccessId}/policies`);
          assert.ok(oldPolicies.length===1&&conversionDigest(stagingOwnerPolicy(oldPolicies[0]))===plan.providerPrestate.sourcePolicyDigest);
          const oldApp=await conversionApi('cloudflare',`${prefix}/apps/${STAGING_TARGET.oldAccessId}`);
          assert.ok(oldApp.domain==='dr.qidaigo.com'&&oldApp.type==='self_hosted'&&oldApp.allowed_idps?.length===1&&oldApp.allowed_idps[0]===plan.providerPrestate.idpId);
          const oldDns=await conversionApi('cloudflare',`/zones/${STAGING_TARGET.zone}/dns_records/${STAGING_TARGET.oldDnsId}`);
          assert.ok(oldDns.id===STAGING_TARGET.oldDnsId&&oldDns.name==='dr.qidaigo.com'&&oldDns.type==='CNAME'&&oldDns.content==='cname.vercel-dns.com'&&oldDns.proxied);
          const dnsPath=`/zones/${STAGING_TARGET.zone}/dns_records/${state.dnsId}`;
          const dns=await conversionApi('cloudflare',dnsPath);
          assert.ok(dns.id===state.dnsId&&dns.name===STAGING_TARGET.host&&dns.type==='CNAME'&&dns.content==='cname.vercel-dns.com'&&dns.proxied&&dns.comment===`Staging conversion ${plan.sourceSha}`);
          // Restore only changed fields from this exact encrypted DR preimage.
          // Reject digest/masked credential recovery and unexpected config drift.
          const allowed=new Set(Object.keys(stagingAuthPatch(recovery.auth)));
          assert.ok(changedNames.every(name=>allowed.has(name)&&!name.startsWith('hook_')));
          assert.ok(/^GOCSPX-/.test(recovery.auth.external_google_secret),'ARCHIVED_CREDENTIAL_NOT_VERIFIABLE');
          const restore=Object.fromEntries(changedNames.map(name=>[name,recovery.auth[name]]));
          await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/config/auth`,{method:'PATCH',body:JSON.stringify(restore)});
          assert.equal(conversionDigest(await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/config/auth`)),plan.providerPrestate.authDigest,'AUTH_PREIMAGE_NOT_RESTORED');
          await checkpoint('original-auth-restored');
          // Recovery-only boundaries; the normal conversion client cannot restore
          // old hosts or delete the temporary Staging mapping by design.
          const vercelWrite=async(path,method,body)=>{
            const domainCreate=method==='POST'&&path===`/v10/projects/${STAGING_TARGET.project}/domains`&&Object.keys(body).length===1&&RETIRED_HOSTS.includes(body.name);
            const aliasRestore=method==='POST'&&path==='/v2/deployments/dpl_5aZES3f8Hp7oKwjjRsnWybJpcT6a/aliases'&&Object.keys(body).length===1&&RETIRED_HOSTS.includes(body.alias);
            const newDomainDelete=method==='DELETE'&&path===`/v9/projects/${STAGING_TARGET.project}/domains/staging.qidaigo.com`&&!body;
            assert.ok(domainCreate||aliasRestore||newDomainDelete,'RECOVERY_WRITE_SCOPE_INVALID');
            const {value}=normalizeProtectedSecret(process.env.VERCEL_TOKEN,'VERCEL_TOKEN');
            const response=await fetch(`https://api.vercel.com${path}?teamId=${STAGING_TARGET.team}`,{method,headers:{authorization:`Bearer ${value}`,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,redirect:'error',signal:AbortSignal.timeout(30000)});
            assert.ok(response.ok,`RECOVERY_VERCEL_HTTP_${response.status}`);
            await checkpoint(domainCreate?'old-domain-restored':aliasRestore?'old-alias-restored':'failed-new-domain-removed');
          };
          for(const old of plan.providerPrestate.retiredAliases){
            await vercelWrite(`/v10/projects/${STAGING_TARGET.project}/domains`,'POST',{name:old.host});
            await vercelWrite(`/v2/deployments/${old.deploymentId}/aliases`,'POST',{alias:old.host});
            const alias=await conversionApi('vercel',`/v4/aliases/${old.host}`);
            assert.ok(alias.uid===old.aliasId&&alias.deploymentId===old.deploymentId&&alias.projectId===STAGING_TARGET.project,'ALIAS_PREIMAGE_NOT_RESTORED');
            const domain=await conversionApi('vercel',`/v9/projects/${STAGING_TARGET.project}/domains/${old.host}`);
            assert.ok(domain.projectId===STAGING_TARGET.project&&domain.verified&&domain.redirect===null&&domain.gitBranch===null&&domain.customEnvironmentId===null);
          }
          await vercelWrite(`/v9/projects/${STAGING_TARGET.project}/domains/staging.qidaigo.com`,'DELETE');
          assert.equal(dnsPath,'/zones/8f8070a80ad4182e4af0c11a1b496968/dns_records/5e1c867daf713106aff87ac5d2260bb4');
          const {value:cloudflareToken}=normalizeProtectedSecret(process.env.CLOUDFLARE_API_TOKEN,'CLOUDFLARE_API_TOKEN');
          const removed=await fetch(`https://api.cloudflare.com/client/v4${dnsPath}`,{method:'DELETE',headers:{authorization:`Bearer ${cloudflareToken}`},redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.ok(removed.ok,'FAILED_NEW_DNS_RECOVERY_FAILED');
          const deletion=await removed.json();assert.ok(deletion.success&&deletion.result?.id===state.dnsId);
          await checkpoint('failed-new-dns-removed');
          await conversionApi('cloudflare',`${prefix}/apps/${state.appId}`,{method:'DELETE'});
          await checkpoint('failed-new-access-removed');
          const restored=await readStagingProviderPrestate();
          const {targetDomainDigest:oldDomainDigest,...oldStable}=plan.providerPrestate;
          const {targetDomainDigest:newDomainDigest,...newStable}=restored;
          assert.equal(conversionDigest(newStable),conversionDigest(oldStable),'PROVIDER_PREIMAGE_NOT_RESTORED');
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          await primary();
          const receipt={failedPlan:39743118579,failedApply:39752454954,recoverySource:process.env.GITHUB_SHA,backup:plan.backup,
            fullOriginalDataUnchanged:true,primaryUnchanged:true,authRestored:true,edgeUnchanged:true,
            retiredAliasIdentityRestored:true,oldDomainDigest,newDomainDigest,domainCreationMetadataChanged:true,
            freshPlanRequired:true,removedNewAccess:state.appId,removedNewDns:state.dnsId,primaryWrites:false};
          await writeFile('artifacts/staging-predata-recovery.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-predata-recovery-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
