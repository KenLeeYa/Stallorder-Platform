name: Bounded Staging Auth nullable-contract diagnostic

on:
  push:
    branches: [codex/staging-auth-isolation-recovery-20261022]
    paths: [.github/workflows/staging-auth-readback-diagnostic.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-dr-operations
  cancel-in-progress: false

jobs:
  readback:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-plan-39724497044
          path: approved-transition-plan
          github-token: ${{ github.token }}
          run-id: 39724497044
      - uses: actions/download-artifact@v4
        with:
          name: dr-retirement-encrypted-39647447270
          path: approved-backup
          github-token: ${{ github.token }}
          run-id: 39647447270
      - name: Verify original state and unchanged disabled Hook contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          BACKUP_RUN_ID: '39647447270'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {conversionApi, conversionDigest, readConversionBackup, readConversionPrimary, verifyOriginalReplica} from './scripts/dr-staging-conversion-plan.mjs';
          import {stagingAuthPatch} from './scripts/staging-data-conversion.mjs';
          const plan=JSON.parse(await readFile('approved-transition-plan/dr-staging-transition-plan.json','utf8'));
          assert.equal(conversionDigest(plan),'4029cd89e30e878a59fb639e7333220dfe629b1af407bd8f4f536831e913c668');
          const backup=await readConversionBackup();
          assert.deepEqual(backup.identity,plan.backup);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          assert.deepEqual(await readConversionPrimary(),plan.primary);
          const auth=await conversionApi('supabase','/v1/projects/daeqwtpaxcebmtwxqdkj/config/auth');
          const edge=await conversionApi('supabase','/v1/projects/daeqwtpaxcebmtwxqdkj/secrets');
          assert.equal(conversionDigest(auth),plan.providerPrestate.authDigest);
          assert.equal(conversionDigest(edge),plan.providerPrestate.edgeSecretsDigest);
          const specResponse=await fetch('https://raw.githubusercontent.com/supabase/supabase/b8483fc454ed2d6fb2b3637fc5da928bc9b1ff6b/apps/docs/spec/api_v1_openapi.json');
          assert.equal(specResponse.status,200);
          const spec=await specResponse.json();
          const properties=spec.components.schemas.UpdateAuthConfigBody.properties;
          const patch=stagingAuthPatch(auth);
          const unknownFields=Object.keys(patch).filter(name=>!properties[name]);
          assert.deepEqual(unknownFields,[]);
          const tokens=await conversionApi('cloudflare','/accounts/b1c70202652cd3b77dfec70e5463785f/access/service_tokens?per_page=1000');
          assert.ok(tokens.length<1000&&!tokens.some(item=>item.id==='ac9c9b77-d7de-469b-acfc-4572aee7adbf'));
          console.log(JSON.stringify({originalDataUnchanged:true,authUnchanged:true,edgeUnchanged:true,primaryUnchanged:true,temporaryQaTokenAbsent:true,unknownFields}));
          const hookPatch=Object.fromEntries(Object.entries(patch).filter(([name])=>/^hook_.+_(enabled|uri|secrets)$/.test(name)));
          assert.ok(Object.keys(hookPatch).length>0);
          for(const [name,value] of Object.entries(hookPatch)) {
            if(value===false) assert.equal(auth[name],false,'Do not change an active Hook during this contract-only check');
            else assert.ok(value===null&&(auth[name]===null||auth[name]===''),'Only already-empty Hooks may be tested');
          }
          const response=await fetch('https://api.supabase.com/v1/projects/daeqwtpaxcebmtwxqdkj/config/auth',{
            method:'PATCH',headers:{Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(hookPatch)
          });
          const responseText=await response.text();
          const after=await conversionApi('supabase','/v1/projects/daeqwtpaxcebmtwxqdkj/config/auth');
          assert.deepEqual(await readConversionPrimary(),plan.primary);
          const values=[...Object.values(auth),...Object.values(patch),...Object.values(process.env)].filter(value=>typeof value==='string'&&value.length>3).sort((a,b)=>b.length-a.length);
          let diagnostic=response.status===400?responseText:'Provider response body omitted for unexpected status';
          for(const value of values) diagnostic=diagnostic.split(value).join('[REDACTED]');
          diagnostic=diagnostic.replace(/(?:sb_secret_|sb_publishable_|eyJ)[A-Za-z0-9_.-]+/g,'[REDACTED]').slice(0,2000);
          console.log(JSON.stringify({authPatchStatus:response.status,diagnostic,authStillUnchanged:conversionDigest(after)===plan.providerPrestate.authDigest,primaryStillUnchanged:true}));
          assert.equal(response.status,200,'Nullable Hook contract not verified; do not continue conversion');
          assert.equal(conversionDigest(after),plan.providerPrestate.authDigest);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          JS
