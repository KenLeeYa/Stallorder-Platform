name: Read-only failed Staging Auth readback diagnosis
on:
  push:
    branches: [codex/staging-auth-readback-recovery-20261022]
    paths: [.github/workflows/staging-auth-readback-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-dr-operations
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'KenLeeYa/Stallorder-Platform' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-plan-39743118579
          path: approved-transition-plan
          github-token: ${{ github.token }}
          run-id: 39743118579
      - uses: actions/download-artifact@v4
        with:
          name: dr-retirement-encrypted-39647447270
          path: approved-backup
          github-token: ${{ github.token }}
          run-id: 39647447270
      - uses: actions/download-artifact@v4
        with:
          name: dr-staging-conversion-39752454954
          path: failed-apply
          github-token: ${{ github.token }}
          run-id: 39752454954
      - name: Compare encrypted prestate to current provider without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DR_BACKUP_ENCRYPTION_KEY: ${{ secrets.DR_BACKUP_ENCRYPTION_KEY }}
          BACKUP_RUN_ID: '39647447270'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import {openBackup} from './scripts/backup-dr-for-staging.mjs';
          import {stagingAuthPatch} from './scripts/staging-data-conversion.mjs';
          import {conversionApi,conversionDigest,readConversionBackup,readConversionPrimary,verifyOriginalReplica,STAGING_TARGET} from './scripts/dr-staging-conversion-plan.mjs';
          const plan=JSON.parse(await readFile('approved-transition-plan/dr-staging-transition-plan.json','utf8'));
          assert.equal(conversionDigest(plan),'a5d29bd42b17eb590483aa0a4f1442e3022f76c9102182c498e7c3e5d8e728ac');
          assert.equal(plan.sourceSha,'16a991fff672ae5f96736edfd97e0ac98b2d7c48');
          const progress=JSON.parse(await readFile('failed-apply/staging-conversion-progress.json','utf8'));
          assert.equal(progress.sourceSha,plan.sourceSha);
          assert.equal(progress.planDigest,conversionDigest(plan));
          assert.deepEqual(progress.completed,['immutable-plan','original-data-matches-qualified-backup','protected-entry-and-token-edit-permissions']);
          const recovery=JSON.parse(openBackup(await readFile('failed-apply/staging-provider-recovery.json.enc'),process.env.DR_BACKUP_ENCRYPTION_KEY));
          assert.equal(recovery.sourceSha,plan.sourceSha);
          assert.equal(recovery.ref,STAGING_TARGET.ref);
          assert.equal(conversionDigest(recovery.auth),plan.providerPrestate.authDigest);
          const backup=await readConversionBackup();
          assert.deepEqual(backup.identity,plan.backup);
          assert.equal(await verifyOriginalReplica(backup.manifest),plan.replicaDigest);
          assert.deepEqual(await readConversionPrimary(),plan.primary);
          const auth=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/config/auth`);
          const edge=await conversionApi('supabase',`/v1/projects/${STAGING_TARGET.ref}/secrets`);
          assert.equal(conversionDigest(edge),plan.providerPrestate.edgeSecretsDigest);
          const expected={...Object.fromEntries(Object.entries(recovery.auth).filter(([name])=>/^hook_.+_(enabled|uri|secrets)$/.test(name))),...stagingAuthPatch(recovery.auth)};
          const mismatches=Object.entries(expected).filter(([name,value])=>name!=='smtp_pass'&&!(value==null||value===''?auth[name]==null||auth[name]==='':String(auth[name])===String(value))).map(([name,value])=>({name,expectedEmpty:value==null||value==='',actualEmpty:auth[name]==null||auth[name]==='',sameAsBefore:auth[name]===recovery.auth[name],beforeEmpty:recovery.auth[name]==null||recovery.auth[name]==='',actualType:typeof auth[name],actualLength:typeof auth[name]==='string'?auth[name].length:null}));
          const changedNames=Object.keys(auth).filter(name=>JSON.stringify(auth[name])!==JSON.stringify(recovery.auth[name]));
          const prefix=`/accounts/${STAGING_TARGET.account}/access`;
          const tokens=await conversionApi('cloudflare',`${prefix}/service_tokens?per_page=1000`);
          assert.ok(tokens.length<1000&&!tokens.some(t=>t.id==='28f5a903-1814-4dd4-880a-e86748024890'));
          const policies=await conversionApi('cloudflare',`${prefix}/apps/1dc12f47-08f7-425f-a6f0-0e24fde0eeea/policies`);
          assert.equal(policies.length,1);
          assert.ok(!policies.some(p=>p.id==='1d7a6873-c232-49cb-b4c8-a618fb21a66c'));
          const result={failedApply:39752454954,failedPlan:39743118579,source:process.env.GITHUB_SHA,ref:STAGING_TARGET.ref,originalDataUnchanged:true,primaryUnchanged:true,edgeUnchanged:true,temporaryQaTokenAbsent:true,temporaryQaPolicyAbsent:true,authDigest:conversionDigest(auth),changedNames,mismatches,primaryWrites:false,providerWrites:false};
          await mkdir('artifacts',{recursive:true});
          await writeFile('artifacts/staging-auth-readback-diagnostic.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: staging-auth-readback-diagnostic-${{ github.run_id }}
          path: artifacts/staging-auth-readback-diagnostic.json
          if-no-files-found: error
          retention-days: 30
